[defaults]
# No default inventory. The lab inventory is generated from Terraform outputs
# (`task lab:inventory`) and passed with -i; see infra/README.md.
roles_path = roles
# Relative paths here resolve against this file: <repo>/.venv/ansible-collections.
collections_path = ../../.venv/ansible-collections
# Unknown or changed host keys stop the run. The first contact with a new
# lab VM is handled explicitly by `task lab:trust-host`.
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
