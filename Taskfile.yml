version: '3'

includes:
  # Proxmox lab VM with k3s and gVisor (infra/README.md): lab:plan, lab:up,
  # lab:down, lab:kubeconfig, lab:smoke, ...
  lab: ./infra/lab/Taskfile.yml
  # The lite profile (Podman, no Kubernetes) on a lab host with a simulated
  # home LAN (deploy/README.md): lite:e2e, lite:scenario, lite:uninstall, ...
  # Needs LITE_HOST, the lab host's address.
  lite: ./infra/lab/lite/Taskfile.yml

vars:
  REGISTRY: ghcr.io/migel9090
  IMAGE: detection-engine
  TAG: dev

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build detection-engine image (current arch, loaded locally)
    cmds:
      - docker buildx build --load
          -t {{.REGISTRY}}/{{.IMAGE}}:{{.TAG}}
          apps/detection-engine/

  build:push:
    desc: Build and push multi-arch image to GHCR
    cmds:
      - docker buildx build
          --platform linux/amd64,linux/arm64
          -t {{.REGISTRY}}/{{.IMAGE}}:{{.TAG}}
          --push
          apps/detection-engine/

  test:
    desc: Run all tests
    cmds:
      - task: test:go
      - task: test:python

  test:go:
    desc: Run Go tests with race detector
    cmds:
      - |
        for dir in apps/*/; do
          if find "$dir" -name '*.go' -print -quit | grep -q .; then
            echo "==> test $dir"
            (cd "$dir" && go test -race -count=1 ./...)
          fi
        done

  test:e2e:
    desc: Run e2e vertical-slice test (builds services, starts mocks)
    dir: tests/e2e
    cmds:
      - go test -v -tags=e2e -count=1 -timeout=120s .

  test:integration:
    desc: Run integration tests with ephemeral ClickHouse (requires Docker)
    dir: tests/e2e
    cmds:
      - go test -v -tags=integration -count=1 -timeout=300s .

  test:security:
    desc: Run killswitch security tests (allowlist, auth, auto-revert)
    dir: apps/killswitch-controller
    cmds:
      - go test -v -race -count=1 -run TestSec ./cmd/killswitch-controller/

  test:pcap:
    desc: Run PCAP replay detection regression tests
    dir: apps/detection-engine
    cmds:
      - go test -v -race -count=1 ./internal/pcapreplay/...

  test:corpus:
    desc: Replay the PCAP corpus through the digest-pinned Suricata and Zeek (needs docker)
    deps: [ci:deps]
    cmds:
      - scripts/ci/pcap-corpus.sh {{.CLI_ARGS}}

  test:corpus:zeek-image:
    desc: Build deploy/docker/zeek and replay the PCAP corpus through that image (needs docker)
    deps: [ci:deps]
    cmds:
      - scripts/ci/pcap-corpus.sh --zeek-image {{.CLI_ARGS}}

  test:python:
    desc: Run Python tests
    dir: apps/ml-anomaly
    cmds:
      - pip install -q -e '.[dev]'
      - pytest --tb=short -q || [ $? -eq 5 ]

  lint:
    desc: Run all linters (the lint job and the static-checks workflow)
    cmds:
      - task: lint:go
      - task: lint:python
      - task: lint:shell
      - task: lint:actions
      - task: lint:quadlet
      - task: lint:prometheus

  # The same commands as the lint job of .github/workflows/ci.yml, so the job
  # can call these targets: gofmt, then vet of every module including
  # libs/ and the tag-gated tests/e2e (a plain vet there matches nothing).
  lint:go:
    desc: gofmt check and go vet of every module, libs/ and tests/e2e included
    env:
      GOWORK: "off"
    cmds:
      - |
        unformatted=$(gofmt -l apps libs tests)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-formatted. Run 'task fmt':"
          echo "$unformatted"
          exit 1
        fi
      - |
        for dir in apps/*/ libs/*/; do
          if find "$dir" -name '*.go' -print -quit | grep -q .; then
            echo "==> vet $dir"
            (cd "$dir" && go vet ./...)
          fi
        done
        echo "==> vet tests/e2e"
        (cd tests/e2e && go vet -tags=e2e ./... && go vet -tags=integration ./...)

  lint:python:
    desc: ruff on ml-anomaly, with the hash-pinned ruff
    deps: [ci:deps]
    cmds:
      - ruff check apps/ml-anomaly/

  lint:shell:
    desc: ShellCheck (pinned) on every tracked shell script, errors and warnings
    cmds:
      - scripts/ci/lint-shell.sh {{.CLI_ARGS}}

  lint:actions:
    desc: actionlint (pinned) on every workflow, with the pinned ShellCheck for run blocks
    cmds:
      - |
        bin=$(scripts/ci/tools.sh install actionlint shellcheck)
        "$bin/actionlint" -shellcheck "$bin/shellcheck" -pyflakes= {{.CLI_ARGS}}

  lint:quadlet:
    desc: Quadlet dry run of deploy/podman/units on Podman 5.4 (needs docker)
    cmds:
      - scripts/ci/quadlet-check.sh

  lint:prometheus:
    desc: promtool check rules, and promtool test rules when observability/tests/ exists
    deps: [ci:deps]
    cmds:
      - scripts/ci/promtool-check.sh

  fmt:
    desc: Format all code
    cmds:
      - gofmt -w apps/
      - goimports -w apps/
      - ruff check --fix apps/ml-anomaly/
      - ruff format apps/ml-anomaly/

  perf:baseline:
    desc: Run performance baseline benchmark against running services
    cmds:
      - bash scripts/perf-baseline.sh

  backup:test-restore:
    desc: Run backup restore verification test
    cmds:
      - bash scripts/backup-restore-test.sh

  # ── CI gates ───────────────────────────────────────────────────
  # The workflows call these targets (with the pinned Task from
  # scripts/ci/tools.sh), so a green run here is a green job there. The
  # scanners need Docker; tools land in ~/.cache/netsoldier
  # (NETSOLDIER_TOOLS overrides).

  ci:deps:
    desc: Install the gates' hash-pinned Python tools (use a virtualenv)
    cmds:
      - python3 -m pip install --quiet --require-hashes -r scripts/ci/requirements.txt

  tools:
    desc: Install the pinned, checksum-verified gate binaries (scripts/ci/tools.sh)
    cmds:
      - scripts/ci/tools.sh install

  ci:prove-gates:
    desc: Plant one defect per gate in a copy of the tree and show each gate failing (needs docker)
    deps: [ci:deps]
    cmds:
      - scripts/ci/prove-gates.sh {{.CLI_ARGS}}

  ci:branch-protection:
    desc: Compare main's live protection with .github/branch-protection.json (read-only)
    cmds:
      - python3 scripts/ci/branch-protection.py --check

  validate:
    desc: Run the validate job (configs, every rendered target, first-party images)
    cmds:
      - task: validate:configs
      - task: validate:manifests
      - task: check:images

  validate:configs:
    desc: Validate deploy configs (YAML syntax + Helm values schemas)
    deps: [ci:deps]
    cmds:
      - python3 scripts/validate-configs.py

  validate:manifests:
    desc: Render every site and profile with kustomize and validate it with kubeconform (strict)
    cmds:
      - scripts/ci/render-manifests.sh {{.CLI_ARGS}}

  check:images:
    desc: Fail when a manifest references a first-party image that CI does not build, sign and attest
    deps: [ci:deps]
    cmds:
      - python3 scripts/check-images.py

  scan:
    desc: Run security scanners locally
    cmds:
      - task: scan:secrets
      - task: scan:sops
      - task: scan:sast
      - task: scan:iac

  scan:secrets:
    desc: gitleaks (pinned) over the whole git history, .gitleaksignore applied
    cmds:
      - |
        bin=$(scripts/ci/tools.sh install gitleaks)
        "$bin/gitleaks" git --redact --no-banner --exit-code 1 {{.CLI_ARGS}} .

  scan:sops:
    desc: No readable Secret committed, real SOPS recipients (scripts/sops-check.sh)
    deps: [ci:deps]
    cmds:
      - scripts/sops-check.sh

  scan:sast:
    desc: Semgrep (pinned, with the pinned rules) against scan-exceptions.toml
    deps: [ci:deps]
    cmds:
      - python3 scripts/ci/iac-gate.py semgrep {{.CLI_ARGS}}

  scan:iac:
    desc: Run the IaC gates (Checkov, KICS, hadolint) against scan-exceptions.toml
    deps: [ci:deps]
    cmds:
      - task: scan:checkov
      - task: scan:kics
      - task: scan:hadolint

  scan:checkov:
    desc: Checkov on every rendered target and the repository's files
    cmds:
      - python3 scripts/ci/iac-gate.py checkov {{.CLI_ARGS}}

  scan:kics:
    desc: KICS (HIGH and CRITICAL) on every rendered target and the repository's files
    cmds:
      - python3 scripts/ci/iac-gate.py kics {{.CLI_ARGS}}

  scan:hadolint:
    desc: hadolint on every tracked Dockerfile and Containerfile
    cmds:
      - python3 scripts/ci/iac-gate.py hadolint {{.CLI_ARGS}}

  sbom:
    desc: Generate CycloneDX SBOM from GHCR image
    cmds:
      - syft {{.REGISTRY}}/{{.IMAGE}}:{{.TAG}} -o cyclonedx-json=detection-engine.cdx.json
      - echo "SBOM written to detection-engine.cdx.json"

  sign:
    desc: Sign image with cosign keyless (opens browser for OIDC)
    cmds:
      - cosign sign --yes {{.REGISTRY}}/{{.IMAGE}}:{{.TAG}}

  up:
    desc: Run detection-engine locally (native Go)
    dir: apps/detection-engine
    cmds:
      - go run ./cmd/detection-engine

  up:docker:
    desc: Run detection-engine in Docker
    deps: [build]
    cmds:
      - docker run --rm -p 8080:8080 {{.REGISTRY}}/{{.IMAGE}}:{{.TAG}}

  pre-commit:
    desc: Run all pre-commit hooks
    cmds:
      - pre-commit run --all-files

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f detection-engine.cdx.json
      - rm -f *.sarif
      - docker rmi {{.REGISTRY}}/{{.IMAGE}}:{{.TAG}} 2>/dev/null || true
