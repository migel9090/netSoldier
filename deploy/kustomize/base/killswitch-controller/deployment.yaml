# killswitch-controller: decides on detections and enforces through the DNS
# sinkhole (AdGuard) and, through netagent, ARP isolation. It sends no frames
# itself: gVisor, no capability. One replica with Recreate: its database is
# the only record of what is enforced and has a single writer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: killswitch-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: killswitch-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: killswitch-controller
    spec:
      serviceAccountName: killswitch-controller
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: killswitch-controller
          image: ghcr.io/migel9090/killswitch-controller:main
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":8084"
            - name: KILLSWITCH_DB_PATH
              value: "/var/lib/killswitch/killswitch.db"
            - name: CLICKHOUSE_URL
              value: "http://clickhouse.netsoldier.svc:8123"
            - name: CLICKHOUSE_DATABASE
              value: "netsoldier"
            # The audit forwarder's account: INSERT on audit_log only.
            - name: CLICKHOUSE_USER
              value: "killswitch"
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: killswitch-password
            # Three roles, three credentials (contract 4, 8.2): the operator
            # token (web UI) on everything but /evaluate and the agent poll;
            # the ingest token (detection-engine) on POST /evaluate only; the
            # agent token (netagent) on POST /agent/v1/poll only.
            - name: KILLSWITCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: killswitch-credentials
                  key: api-key
            - name: KILLSWITCH_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: killswitch-credentials
                  key: ingest-token
            - name: NETAGENT_KILLSWITCH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: netagent-credentials
                  key: killswitch-token
            # Signature v2 on every detection event (contract 2).
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: killswitch-credentials
                  key: webhook-secret
            # Protected devices: the site's gateway (by IP and MAC) and its
            # allowlist. Without an allowlist nothing is auto-blocked.
            - name: GATEWAY_IP
              valueFrom:
                configMapKeyRef:
                  name: netsoldier-site
                  key: GATEWAY_IP
                  optional: true
            - name: GATEWAY_MAC
              valueFrom:
                configMapKeyRef:
                  name: netsoldier-site
                  key: GATEWAY_MAC
                  optional: true
            - name: ALLOWLIST_IPS
              valueFrom:
                configMapKeyRef:
                  name: netsoldier-site
                  key: ALLOWLIST_IPS
                  optional: true
            - name: ALLOWLIST_MACS
              valueFrom:
                configMapKeyRef:
                  name: netsoldier-site
                  key: ALLOWLIST_MACS
                  optional: true
            - name: ADGUARD_URL
              value: "http://adguard-web.dns.svc:3000"
            - name: ADGUARD_USER
              valueFrom:
                secretKeyRef:
                  name: adguard-credentials
                  key: username
            - name: ADGUARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adguard-credentials
                  key: password
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 96Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/killswitch
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: killswitch-data
        - name: tmp
          emptyDir: {}
