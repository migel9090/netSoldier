apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-detection-engine
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: detection-engine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web-ui
      ports:
        - port: 8080
          protocol: TCP
    # Metrics scrape only. This used to admit the entire observability
    # namespace, which also reached POST /feedback — the suppression
    # endpoint. Narrowed to the Prometheus pod; the endpoint is authenticated
    # now, but the blast radius should not depend on that alone.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dns
          podSelector:
            matchLabels:
              app.kubernetes.io/name: adguard-home
      ports:
        - port: 3000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 4317
          protocol: TCP
    # correlator writes + unified sensor ingest reads (step 109)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
              app.kubernetes.io/component: server
      ports:
        - port: 8123
          protocol: TCP
    # device enrichment for the correlator
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: device-inventory
      ports:
        - port: 8081
          protocol: TCP
    # IoC feed sync (iocmatch.SyncLoop)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: threat-intel-sync
      ports:
        - port: 8083
          protocol: TCP
    # Enforcement webhook → killswitch /evaluate. This rule was missing, and
    # with the namespace-wide default-deny on Egress that silently dropped
    # every detection on its way to the killswitch: the controller's ingress
    # allowed detection-engine, but NetworkPolicy needs both halves. The
    # detection → response path was severed in the shipped manifests.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: killswitch-controller
      ports:
        - port: 8084
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
