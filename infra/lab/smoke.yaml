# Workloads for infra/lab/smoke.sh. Every pod meets the "restricted" Pod
# Security Standard and the ADR-0004 defaults: non-root, no capabilities,
# read-only root filesystem, RuntimeDefault seccomp. Like the product's own
# workloads they also carry resource requests and limits and run behind a
# default-deny NetworkPolicy that admits only the one connection the check
# makes (the policies at the end, the same pattern as
# deploy/kustomize/base/network-policies).
apiVersion: v1
kind: Namespace
metadata:
  name: netsoldier-smoke
  labels:
    pod-security.kubernetes.io/enforce: restricted
    app.kubernetes.io/part-of: netsoldier-smoke
---
# The same image and command twice: in gVisor, and on the default runtime.
apiVersion: v1
kind: Pod
metadata:
  name: kernel-gvisor
  namespace: netsoldier-smoke
  labels:
    app: kernel-gvisor
spec:
  runtimeClassName: gvisor
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command:
        - sh
        - -c
        - |
          echo "uname-r: $(uname -r)"
          echo "proc-version: $(cat /proc/version)"
          echo "seccomp: $(grep '^Seccomp:' /proc/self/status | tr -s '\t ' ' ')"
          echo "dmesg: $(dmesg 2>&1 | head -n 1)"
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 200m, memory: 128Mi }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
---
apiVersion: v1
kind: Pod
metadata:
  name: kernel-runc
  namespace: netsoldier-smoke
  labels:
    app: kernel-runc
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command:
        - sh
        - -c
        - |
          echo "uname-r: $(uname -r)"
          echo "proc-version: $(cat /proc/version)"
          echo "seccomp: $(grep '^Seccomp:' /proc/self/status | tr -s '\t ' ' ')"
          echo "dmesg: $(dmesg 2>&1 | head -n 1)"
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 200m, memory: 128Mi }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
---
# One of the project's own Go services, in gVisor. It has no configuration
# here and says so in its log; the point is that the binary runs under runsc
# far enough to serve /healthz.
apiVersion: v1
kind: Pod
metadata:
  name: detection-engine
  namespace: netsoldier-smoke
  labels:
    app: detection-engine
spec:
  runtimeClassName: gvisor
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: detection-engine
      image: ghcr.io/migel9090/detection-engine:main
      # The check is about the image published now. With the default
      # (IfNotPresent for a non-latest tag) a node that pulled :main once
      # would keep testing that old build.
      imagePullPolicy: Always
      ports:
        - name: http
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /healthz
          port: http
        periodSeconds: 3
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        periodSeconds: 10
        failureThreshold: 6
      resources:
        requests: { cpu: 50m, memory: 32Mi }
        limits: { cpu: 500m, memory: 256Mi }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: detection-engine
  namespace: netsoldier-smoke
spec:
  selector:
    app: detection-engine
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Asks the service over the cluster network (CoreDNS, kube-proxy, then
# gVisor's network stack in the detection-engine sandbox).
apiVersion: v1
kind: Pod
metadata:
  name: healthz-client
  namespace: netsoldier-smoke
  labels:
    app: healthz-client
spec:
  runtimeClassName: gvisor
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command:
        - sh
        - -c
        - |
          for i in $(seq 1 30); do
            if out=$(wget -q -T 5 -O - http://detection-engine.netsoldier-smoke.svc:8080/healthz); then
              echo "healthz: $out"; exit 0
            fi
            sleep 2
          done
          echo "healthz: no answer"; exit 1
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 200m, memory: 128Mi }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
---
# Nothing in the namespace talks to anything unless a policy below says so.
# The kernel-* pods only read their own kernel's view and need no network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: netsoldier-smoke
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# The one connection the check makes: healthz-client -> detection-engine:8080.
# detection-engine may resolve names (it fails fast on the services it is not
# configured for, as it did without a policy); kubelet probes come from the
# node and are not subject to the policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-detection-engine
  namespace: netsoldier-smoke
spec:
  podSelector:
    matchLabels:
      app: detection-engine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: healthz-client
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-healthz-client
  namespace: netsoldier-smoke
spec:
  podSelector:
    matchLabels:
      app: healthz-client
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: detection-engine
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
