# Template for SOPS-encrypted ArgoCD admin password.
#
# 1. Copy this file to argocd-admin-password.sops.yaml
# 2. Replace the placeholder bcrypt hash with a real one:
#      htpasswd -nbBC 10 "" 'YOUR_PASSWORD' | cut -d: -f2
# 3. Encrypt with SOPS (requires age key from step 34):
#      sops --encrypt --in-place argocd-admin-password.sops.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
type: Opaque
stringData:
  admin.password: "$2a$10$REPLACE_WITH_BCRYPT_HASH"
  admin.passwordMtime: "2026-02-01T00:00:00Z"
