# Single-node Garage backing the ClickHouse cold tier (step 119) and the
# backup CronJob. S3 API only.
#
# Replaces MinIO: MinIO withdrew its public `minio/minio` and `minio/mc`
# images, so the previous StatefulSet referenced a tag that can no longer
# be pulled and the storage namespace could not come up at all.
#
# Secrets (RPC network key, admin token) come from the `garage-secrets`
# Secret via env — see secret.example.yaml; real values are provided
# through SOPS, never committed.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garage
          image: dxflrs/garage:v2.4.1
          args: ["server"]
          env:
            - name: GARAGE_CONFIG_FILE
              value: /etc/garage.toml
            # Garage refuses to read a secret file that is group/world
            # readable; projected Secret volumes are 0644, so the secrets
            # are passed as env instead.
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: GARAGE_RPC_SECRET
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: GARAGE_ADMIN_TOKEN
          ports:
            - name: s3
              containerPort: 3900
              protocol: TCP
            - name: rpc
              containerPort: 3901
              protocol: TCP
            - name: admin
              containerPort: 3903
              protocol: TCP
          # The process binds its listeners long before the cluster is
          # usable, so startup/liveness only assert "the server is up" and
          # readiness carries the real signal.
          startupProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 15
          # /health is 503 until a layout is applied and the node holds its
          # partitions, which is what keeps ClickHouse off a node that
          # cannot actually serve the cold tier.
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: data
              mountPath: /var/lib/garage
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
