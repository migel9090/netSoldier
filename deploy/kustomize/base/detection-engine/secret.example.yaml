# Example only — the real Secret is SOPS-encrypted and never committed in
# plaintext.
#
# This file used to ship admin/changeme, exactly matching the hardcoded
# fallbacks in the code, so applying it verbatim left the AdGuard admin
# account on a guessable password. AdGuard is the DNS sinkhole enforcement
# point: whoever holds this can unblock anything the killswitch blocks, and
# redirect every name the household resolves. The code no longer falls back
# to a default — it logs an error and the driver fails — so this has to be
# set deliberately.
#
#   openssl rand -base64 24
apiVersion: v1
kind: Secret
metadata:
  name: adguard-credentials
type: Opaque
stringData:
  username: "netsoldier"
  password: "CHANGE-ME-generate-with-openssl-rand-base64-24"
