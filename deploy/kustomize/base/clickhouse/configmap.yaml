apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
data:
  memory-limits.xml: |
    <clickhouse>
        <max_server_memory_usage_ratio>0.5</max_server_memory_usage_ratio>
        <background_pool_size>4</background_pool_size>
        <background_schedule_pool_size>2</background_schedule_pool_size>
        <mark_cache_size>536870912</mark_cache_size>
    </clickhouse>
  storage.xml: |
    <clickhouse>
        <storage_configuration>
            <disks>
                <!-- Cold tier on in-cluster MinIO (step 119). Credentials
                     come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env
                     vars (clickhouse-cold-export-s3 secret, optional).
                     skip_access_check lets the server boot when MinIO is
                     down or the secret is absent: inserts always land on
                     the hot volume first, only background TTL moves fail
                     (and retry) until the cold disk is reachable. -->
                <s3_cold>
                    <type>s3</type>
                    <endpoint>http://minio.storage.svc:9000/netsoldier-cold/native/</endpoint>
                    <use_environment_credentials>true</use_environment_credentials>
                    <skip_access_check>true</skip_access_check>
                    <metadata_path>/var/lib/clickhouse/disks/s3_cold/</metadata_path>
                </s3_cold>
            </disks>
            <policies>
                <!-- The hot volume keeps the name `default` so tables
                     created under the implicit default policy can be
                     switched with ALTER ... MODIFY SETTING storage_policy
                     (the new policy must contain the old volumes/disks). -->
                <tiered>
                    <volumes>
                        <default>
                            <disk>default</disk>
                        </default>
                        <cold>
                            <disk>s3_cold</disk>
                            <!-- Never write parts straight to S3 on insert,
                                 even when their move-TTL is already expired
                                 (e.g. backfilled data): an unreachable MinIO
                                 must not block ingest. Background moves pick
                                 the parts up later. -->
                            <perform_ttl_move_on_insert>false</perform_ttl_move_on_insert>
                        </cold>
                    </volumes>
                </tiered>
            </policies>
        </storage_configuration>
    </clickhouse>
  users-override.xml: |
    <clickhouse>
        <profiles>
            <default>
                <max_memory_usage>1073741824</max_memory_usage>
                <max_execution_time>60</max_execution_time>
            </default>
            <!-- RITA v5 emits SQL that the new ClickHouse analyzer rejects
                 (ARRAY JOIN aliases not in GROUP BY); scope the legacy
                 analyzer to RITA only so netSoldier's own queries keep the
                 default. RITA imports are long-running batch scans. -->
            <rita>
                <allow_experimental_analyzer>0</allow_experimental_analyzer>
                <max_execution_time>1800</max_execution_time>
            </rita>
        </profiles>
        <users>
            <!-- Dedicated user for the RITA importer; manages only its own
                 netsoldier_rita / metadatabase databases. Reachable only
                 from the rita pod via NetworkPolicy. -->
            <rita>
                <password></password>
                <profile>rita</profile>
                <networks><ip>::/0</ip></networks>
                <access_management>1</access_management>
                <named_collection_control>1</named_collection_control>
            </rita>
        </users>
    </clickhouse>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-init
data:
  001_database.sql: |
    CREATE DATABASE IF NOT EXISTS netsoldier;
  002_devices.sql: |
    CREATE TABLE IF NOT EXISTS netsoldier.devices (
        mac          String,
        ip           String,
        hostname     String,
        fingerprint  String,
        vendor_class String,
        vendor       String,
        os           String,
        device_type  String,
        stable_id    String,
        labels       Array(String),
        first_seen   DateTime,
        last_seen    DateTime,
        updated_at   DateTime DEFAULT now()
    ) ENGINE = ReplacingMergeTree(updated_at)
    ORDER BY mac;
    CREATE TABLE IF NOT EXISTS netsoldier.device_events (
        timestamp    DateTime,
        mac          String,
        ip           String,
        hostname     String,
        vendor       String,
        protocol     LowCardinality(String),
        event_type   LowCardinality(String)
    ) ENGINE = MergeTree()
    ORDER BY (timestamp, mac)
    TTL timestamp + INTERVAL 30 DAY;
  003_network_flows.sql: |
    CREATE TABLE IF NOT EXISTS netsoldier.network_flows (
        timestamp    DateTime,
        src_ip       String,
        src_port     UInt16,
        dst_ip       String,
        dst_port     UInt16,
        protocol     UInt8,
        bytes_in     UInt64,
        bytes_out    UInt64,
        packets_in   UInt32,
        packets_out  UInt32,
        duration_ms  UInt32,
        tcp_flags    UInt8,
        vlan_id      UInt16
    ) ENGINE = MergeTree()
    ORDER BY (timestamp, src_ip, dst_ip)
    TTL timestamp + INTERVAL 30 DAY;
  004_dns_queries.sql: |
    CREATE TABLE IF NOT EXISTS netsoldier.dns_queries (
        timestamp    DateTime,
        client_ip    String,
        domain       String,
        query_type   LowCardinality(String),
        answer       String,
        status       LowCardinality(String),
        response_ms  UInt16,
        blocked      UInt8
    ) ENGINE = MergeTree()
    ORDER BY (timestamp, client_ip, domain)
    TTL timestamp + INTERVAL 30 DAY;
  005_alerts.sql: |
    CREATE TABLE IF NOT EXISTS netsoldier.alerts (
        timestamp    DateTime,
        id           String,
        domain       String,
        client_ip    String,
        query_type   LowCardinality(String),
        matched_ioc  String,
        severity     LowCardinality(String),
        source       LowCardinality(String),
        acknowledged UInt8 DEFAULT 0
    ) ENGINE = ReplacingMergeTree()
    ORDER BY (timestamp, id)
    TTL timestamp + INTERVAL 90 DAY;
  006_events.sql: |
    CREATE TABLE IF NOT EXISTS netsoldier.events (
        timestamp    DateTime,
        source       LowCardinality(String),
        level        LowCardinality(String),
        message      String,
        metadata     String
    ) ENGINE = MergeTree()
    ORDER BY (timestamp, source)
    TTL timestamp + INTERVAL 90 DAY;
  007_connections.sql: |
    CREATE TABLE IF NOT EXISTS netsoldier.connections (
        timestamp       DateTime,
        src_mac         String,
        src_hostname    String,
        src_vendor      String,
        src_os          String,
        src_device_type String,
        src_ip          String,
        src_port        UInt16,
        dst_ip          String,
        dst_domain      String,
        dst_port        UInt16,
        protocol        UInt8,
        bytes_in        UInt64,
        bytes_out       UInt64,
        packets_in      UInt32,
        packets_out     UInt32,
        duration_ms     UInt32,
        tcp_flags       UInt8,
        vlan_id         UInt16
    ) ENGINE = MergeTree()
    ORDER BY (timestamp, src_mac, dst_ip)
    TTL timestamp + INTERVAL 30 DAY;
  008_audit_log.sql: |
    CREATE TABLE IF NOT EXISTS netsoldier.audit_log (
        timestamp    DateTime,
        action_id    String,
        from_state   LowCardinality(String),
        to_state     LowCardinality(String),
        actor        String,
        reason       String,
        detection_id String,
        target_mac   String,
        target_ip    String,
        action_type  LowCardinality(String)
    ) ENGINE = MergeTree()
    ORDER BY (timestamp, action_id)
    TTL timestamp + INTERVAL 180 DAY;
  009_retention.sql: |
    ALTER TABLE netsoldier.alerts MODIFY TTL timestamp + INTERVAL 90 DAY;
    ALTER TABLE netsoldier.audit_log MODIFY TTL timestamp + INTERVAL 180 DAY;
  010_suricata.sql: |
    CREATE TABLE IF NOT EXISTS netsoldier.suricata_alerts (
        timestamp    DateTime,
        flow_id      UInt64,
        src_ip       String,
        src_port     UInt16,
        dest_ip      String,
        dest_port    UInt16,
        proto        LowCardinality(String),
        alert_action LowCardinality(String),
        alert_gid    UInt32,
        alert_signature_id UInt32,
        alert_rev    UInt32,
        alert_signature    String,
        alert_category     LowCardinality(String),
        alert_severity     UInt8,
        app_proto    LowCardinality(String),
        flow_pkts_toserver  UInt32 DEFAULT 0,
        flow_pkts_toclient  UInt32 DEFAULT 0,
        flow_bytes_toserver UInt64 DEFAULT 0,
        flow_bytes_toclient UInt64 DEFAULT 0,
        threat_intel String DEFAULT ''
    ) ENGINE = MergeTree()
    ORDER BY (timestamp, alert_signature_id, src_ip)
    TTL timestamp + INTERVAL 90 DAY;
    ALTER TABLE netsoldier.suricata_alerts
        ADD COLUMN IF NOT EXISTS threat_intel String DEFAULT '';
    CREATE TABLE IF NOT EXISTS netsoldier.suricata_dns (
        timestamp    DateTime,
        flow_id      UInt64,
        src_ip       String,
        src_port     UInt16,
        dest_ip      String,
        dest_port    UInt16,
        proto        LowCardinality(String),
        dns_type     LowCardinality(String),
        dns_rrtype   LowCardinality(String),
        dns_rrname   String,
        dns_rdata    String,
        dns_rcode    LowCardinality(String),
        dns_id       UInt16
    ) ENGINE = MergeTree()
    ORDER BY (timestamp, src_ip, dns_rrname)
    TTL timestamp + INTERVAL 30 DAY;
    CREATE TABLE IF NOT EXISTS netsoldier.suricata_tls (
        timestamp    DateTime,
        flow_id      UInt64,
        src_ip       String,
        src_port     UInt16,
        dest_ip      String,
        dest_port    UInt16,
        proto        LowCardinality(String),
        tls_version  LowCardinality(String),
        tls_sni      String,
        tls_subject  String,
        tls_issuerdn String,
        tls_serial   String,
        tls_ja3_hash  String,
        tls_ja3s_hash String
    ) ENGINE = MergeTree()
    ORDER BY (timestamp, src_ip, tls_sni)
    TTL timestamp + INTERVAL 30 DAY;
  011_zeek.sql: |
    CREATE TABLE IF NOT EXISTS netsoldier.zeek_conn (
        timestamp   DateTime,
        uid         String,
        src_ip      String,
        src_port    UInt16,
        dst_ip      String,
        dst_port    UInt16,
        proto       LowCardinality(String),
        service     LowCardinality(String),
        duration_ms UInt64,
        orig_bytes  UInt64,
        resp_bytes  UInt64,
        conn_state  LowCardinality(String),
        local_orig  UInt8,
        local_resp  UInt8,
        history     String,
        orig_pkts   UInt64,
        resp_pkts   UInt64
    ) ENGINE = MergeTree()
    ORDER BY (timestamp, src_ip, dst_ip)
    TTL timestamp + INTERVAL 30 DAY;
    CREATE TABLE IF NOT EXISTS netsoldier.zeek_dns (
        timestamp  DateTime,
        uid        String,
        src_ip     String,
        src_port   UInt16,
        dst_ip     String,
        dst_port   UInt16,
        proto      LowCardinality(String),
        query      String,
        qtype_name LowCardinality(String),
        rcode_name LowCardinality(String),
        answers    Array(String),
        rejected   UInt8
    ) ENGINE = MergeTree()
    ORDER BY (timestamp, src_ip, query)
    TTL timestamp + INTERVAL 30 DAY;
    CREATE TABLE IF NOT EXISTS netsoldier.zeek_ssl (
        timestamp   DateTime,
        uid         String,
        src_ip      String,
        src_port    UInt16,
        dst_ip      String,
        dst_port    UInt16,
        version     LowCardinality(String),
        cipher      LowCardinality(String),
        curve       LowCardinality(String),
        server_name String,
        resumed     UInt8,
        established UInt8,
        subject     String,
        issuer      String,
        ja3           String DEFAULT '',
        ja3s          String DEFAULT '',
        tls_client_fp String DEFAULT ''
    ) ENGINE = MergeTree()
    ORDER BY (timestamp, src_ip, server_name)
    TTL timestamp + INTERVAL 30 DAY;
    ALTER TABLE netsoldier.zeek_ssl ADD COLUMN IF NOT EXISTS ja3 String DEFAULT '';
    ALTER TABLE netsoldier.zeek_ssl ADD COLUMN IF NOT EXISTS ja3s String DEFAULT '';
    ALTER TABLE netsoldier.zeek_ssl ADD COLUMN IF NOT EXISTS tls_client_fp String DEFAULT '';
    CREATE TABLE IF NOT EXISTS netsoldier.zeek_x509 (
        timestamp        DateTime,
        fingerprint      String,
        serial           String,
        subject          String,
        issuer           String,
        not_valid_before DateTime,
        not_valid_after  DateTime,
        key_alg          LowCardinality(String),
        key_length       UInt16,
        san_dns          Array(String)
    ) ENGINE = MergeTree()
    ORDER BY (timestamp, fingerprint)
    TTL timestamp + INTERVAL 30 DAY;
    CREATE TABLE IF NOT EXISTS netsoldier.zeek_http (
        timestamp         DateTime,
        uid               String,
        src_ip            String,
        src_port          UInt16,
        dst_ip            String,
        dst_port          UInt16,
        method            LowCardinality(String),
        host              String,
        uri               String,
        referrer          String,
        user_agent        String,
        status_code       UInt16,
        request_body_len  UInt64,
        response_body_len UInt64
    ) ENGINE = MergeTree()
    ORDER BY (timestamp, src_ip, host)
    TTL timestamp + INTERVAL 30 DAY;
  012_drop_foxio_fingerprints.sql: |
    -- ADR-0003: the FoxIO-licensed JA4+ package was replaced by a
    -- first-party JA4 (BSD spec) implementation; JA4S/JA4H are gone.
    ALTER TABLE netsoldier.zeek_ssl DROP COLUMN IF EXISTS ja4s;
    ALTER TABLE netsoldier.zeek_http DROP COLUMN IF EXISTS ja4h;
  013_zeek_intel.sql: |
    -- Zeek Intel framework hits (step 107): IoC observations on live
    -- traffic (DOMAIN via SNI/DNS/cert, ADDR, JA3, first-party JA4, ...).
    CREATE TABLE IF NOT EXISTS netsoldier.zeek_intel (
        timestamp      DateTime,
        uid            String,
        src_ip         String,
        src_port       UInt16,
        dst_ip         String,
        dst_port       UInt16,
        indicator      String,
        indicator_type LowCardinality(String),
        seen_where     LowCardinality(String),
        matched        Array(String),
        sources        Array(String)
    ) ENGINE = MergeTree()
    ORDER BY (timestamp, indicator)
    TTL timestamp + INTERVAL 30 DAY;
  014_ml_beacons.sql: |
    -- ml-anomaly beacon detections derived from RITA threat_mixtape
    -- (step 112). detection-engine's unified ingest tails this table.
    CREATE TABLE IF NOT EXISTS netsoldier.ml_beacons (
        timestamp        DateTime DEFAULT now(),
        src_ip           String,
        dst_ip           String,
        dst_domain       String DEFAULT '',
        beacon_score     Float64,
        connection_count UInt32,
        confidence       UInt8,
        severity         LowCardinality(String),
        beacon_type      LowCardinality(String) DEFAULT '',
        tags             Array(String)
    ) ENGINE = ReplacingMergeTree(timestamp)
    ORDER BY (src_ip, dst_ip)
    TTL timestamp + INTERVAL 30 DAY;
  015_rename_ja4_column.sql: |
    -- ADR-0003: our produced TLS client fingerprint is renamed off the FoxIO
    -- trademark "JA4" to the neutral, descriptive tls_client_fp. The values
    -- stay JA4-format-compatible. Rename the column for existing databases
    -- (the fresh CREATE above already uses the new name; guard so re-runs and
    -- fresh installs are both no-ops).
    ALTER TABLE netsoldier.zeek_ssl
        RENAME COLUMN IF EXISTS ja4 TO tls_client_fp;
  016_ml_anomalies.sql: |
    -- ml-anomaly Isolation Forest flow anomalies (step 113): per-source
    -- window aggregates that deviate from the household baseline. Feature
    -- snapshot is stored alongside the score so an analyst can see *why*
    -- a window was flagged. detection-engine's unified ingest tails this
    -- table as the volumetric signal for composite-confidence (step 116).
    CREATE TABLE IF NOT EXISTS netsoldier.ml_anomalies (
        timestamp       DateTime DEFAULT now(),
        window_start    DateTime,
        src_ip          String,
        anomaly_score   Float64,
        confidence      UInt8,
        severity        LowCardinality(String),
        conn_count      UInt32,
        bytes_out       UInt64,
        bytes_in        UInt64,
        dst_fanout      UInt32,
        port_fanout     UInt32,
        avg_duration_ms Float64,
        model_version   LowCardinality(String),
        tags            Array(String)
    ) ENGINE = ReplacingMergeTree(timestamp)
    ORDER BY (src_ip, window_start)
    TTL timestamp + INTERVAL 30 DAY;
  017_detection_feedback.sql: |
    -- Analyst false-positive feedback (step 118). detection-engine records
    -- each verdict here and, on restart, rebuilds active suppressions with
    -- argMax(verdict, timestamp) per (matched_ioc, client_ip). An empty
    -- client_ip scopes the verdict to the indicator on every device.
    CREATE TABLE IF NOT EXISTS netsoldier.detection_feedback (
        timestamp   DateTime DEFAULT now(),
        alert_id    String DEFAULT '',
        matched_ioc String,
        client_ip   String DEFAULT '',
        verdict     LowCardinality(String),
        reason      String DEFAULT '',
        analyst     String DEFAULT ''
    ) ENGINE = ReplacingMergeTree(timestamp)
    ORDER BY (matched_ioc, client_ip, timestamp)
    TTL timestamp + INTERVAL 365 DAY;
  018_cold_tier.sql: |
    -- Cold tier (step 119): move aged parts to the MinIO-backed `cold`
    -- volume (storage.xml `tiered` policy) and extend total retention.
    -- Append-only time-series tables only; ReplacingMergeTree state
    -- tables (ml_beacons, ml_anomalies, detection_feedback) stay
    -- hot-only and are archived by the daily Parquet cold-export.
    ALTER TABLE netsoldier.network_flows MODIFY SETTING storage_policy = 'tiered';
    ALTER TABLE netsoldier.network_flows MODIFY TTL timestamp + INTERVAL 30 DAY TO VOLUME 'cold', timestamp + INTERVAL 365 DAY DELETE;
    ALTER TABLE netsoldier.dns_queries MODIFY SETTING storage_policy = 'tiered';
    ALTER TABLE netsoldier.dns_queries MODIFY TTL timestamp + INTERVAL 30 DAY TO VOLUME 'cold', timestamp + INTERVAL 365 DAY DELETE;
    ALTER TABLE netsoldier.connections MODIFY SETTING storage_policy = 'tiered';
    ALTER TABLE netsoldier.connections MODIFY TTL timestamp + INTERVAL 30 DAY TO VOLUME 'cold', timestamp + INTERVAL 365 DAY DELETE;
    ALTER TABLE netsoldier.device_events MODIFY SETTING storage_policy = 'tiered';
    ALTER TABLE netsoldier.device_events MODIFY TTL timestamp + INTERVAL 30 DAY TO VOLUME 'cold', timestamp + INTERVAL 365 DAY DELETE;
    ALTER TABLE netsoldier.alerts MODIFY SETTING storage_policy = 'tiered';
    ALTER TABLE netsoldier.alerts MODIFY TTL timestamp + INTERVAL 90 DAY TO VOLUME 'cold', timestamp + INTERVAL 365 DAY DELETE;
    ALTER TABLE netsoldier.events MODIFY SETTING storage_policy = 'tiered';
    ALTER TABLE netsoldier.events MODIFY TTL timestamp + INTERVAL 90 DAY TO VOLUME 'cold', timestamp + INTERVAL 365 DAY DELETE;
    ALTER TABLE netsoldier.suricata_alerts MODIFY SETTING storage_policy = 'tiered';
    ALTER TABLE netsoldier.suricata_alerts MODIFY TTL timestamp + INTERVAL 90 DAY TO VOLUME 'cold', timestamp + INTERVAL 365 DAY DELETE;
    ALTER TABLE netsoldier.suricata_dns MODIFY SETTING storage_policy = 'tiered';
    ALTER TABLE netsoldier.suricata_dns MODIFY TTL timestamp + INTERVAL 30 DAY TO VOLUME 'cold', timestamp + INTERVAL 365 DAY DELETE;
    ALTER TABLE netsoldier.suricata_tls MODIFY SETTING storage_policy = 'tiered';
    ALTER TABLE netsoldier.suricata_tls MODIFY TTL timestamp + INTERVAL 30 DAY TO VOLUME 'cold', timestamp + INTERVAL 365 DAY DELETE;
    ALTER TABLE netsoldier.zeek_conn MODIFY SETTING storage_policy = 'tiered';
    ALTER TABLE netsoldier.zeek_conn MODIFY TTL timestamp + INTERVAL 30 DAY TO VOLUME 'cold', timestamp + INTERVAL 365 DAY DELETE;
    ALTER TABLE netsoldier.zeek_dns MODIFY SETTING storage_policy = 'tiered';
    ALTER TABLE netsoldier.zeek_dns MODIFY TTL timestamp + INTERVAL 30 DAY TO VOLUME 'cold', timestamp + INTERVAL 365 DAY DELETE;
    ALTER TABLE netsoldier.zeek_ssl MODIFY SETTING storage_policy = 'tiered';
    ALTER TABLE netsoldier.zeek_ssl MODIFY TTL timestamp + INTERVAL 30 DAY TO VOLUME 'cold', timestamp + INTERVAL 365 DAY DELETE;
    ALTER TABLE netsoldier.zeek_x509 MODIFY SETTING storage_policy = 'tiered';
    ALTER TABLE netsoldier.zeek_x509 MODIFY TTL timestamp + INTERVAL 30 DAY TO VOLUME 'cold', timestamp + INTERVAL 365 DAY DELETE;
    ALTER TABLE netsoldier.zeek_http MODIFY SETTING storage_policy = 'tiered';
    ALTER TABLE netsoldier.zeek_http MODIFY TTL timestamp + INTERVAL 30 DAY TO VOLUME 'cold', timestamp + INTERVAL 365 DAY DELETE;
    ALTER TABLE netsoldier.zeek_intel MODIFY SETTING storage_policy = 'tiered';
    ALTER TABLE netsoldier.zeek_intel MODIFY TTL timestamp + INTERVAL 30 DAY TO VOLUME 'cold', timestamp + INTERVAL 365 DAY DELETE;
    ALTER TABLE netsoldier.audit_log MODIFY SETTING storage_policy = 'tiered';
    ALTER TABLE netsoldier.audit_log MODIFY TTL timestamp + INTERVAL 180 DAY TO VOLUME 'cold', timestamp + INTERVAL 730 DAY DELETE;
