apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonLabels:
  app.kubernetes.io/instance: pi-edge

resources:
  # Everything that belongs in the netsoldier namespace. Kept in a nested
  # kustomization so its namespace transformer cannot reach AdGuard.
  - netsoldier/
  # AdGuard owns the `dns` namespace and must keep it.
  - ../../../adguard/
