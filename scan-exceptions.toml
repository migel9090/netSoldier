# ════════════════════════════════════════════════════════════════════════════
# KICS (gates on HIGH and CRITICAL)
# ════════════════════════════════════════════════════════════════════════════

# Non Kube System Pod With Host Mount
[[exception]]
tool = "kics"
rule = "aa8f7a35-9923-4cad-bd61-a19b7f6aac91"
resources = ["DaemonSet/netsoldier/fluent-bit"]
until = 2027-05-15
reason = """Fluent Bit is the node log shipper: it mounts the node's systemd
journal (/run/log/journal) and /etc/machine-id from the host, both read-only,
which is the job. Nothing from the host is writable."""

# Workload Mounting With Sensitive OS Directory
[[exception]]
tool = "kics"
rule = "5308a7a8-06f8-45ac-bf10-791fe21de46e"
resources = ["DaemonSet/netsoldier/fluent-bit"]
until = 2027-05-15
reason = """The same two read-only hostPath mounts (the journal and
/etc/machine-id) that a node log shipper reads; see the entry above."""

# Volume Mount With OS Directory Write Permissions
[[exception]]
tool = "kics"
rule = "b7652612-de4e-4466-a0bf-1cd81f0c6063"
resources = [
  "DaemonSet/netsoldier/netagent",
  "Deployment/netsoldier/killswitch-controller",
  "Deployment/netsoldier/threat-intel-sync",
  "StatefulSet/netsoldier/misp",
  "StatefulSet/netsoldier/misp-mariadb",
]
until = 2027-05-15
reason = """The writable mounts are the pod's own PersistentVolumeClaim or
emptyDir (state, the health file, sockets, logs), not host directories: the
query keys on the mount path alone. They sit under /var/lib or /run inside a
read-only root filesystem because that is where each program keeps its state;
no hostPath is involved."""

# Passwords And Secrets - Generic Password
[[exception]]
tool = "kics"
rule = "487f4be7-3fd9-4506-a07a-eae252180c08"
resources = ["ConfigMap/netsoldier/suricata-vector-config", "ConfigMap/netsoldier/zeek-vector-config"]
files = ["deploy/observability/vector/values.yaml"]
until = 2027-05-15
reason = """False positive: every flagged `password:` line is Vector's
environment interpolation, "${CLICKHOUSE_PASSWORD:?...}"; the value comes
from a Secret at runtime and is never in the file."""

# Passwords And Secrets - Generic Secret
[[exception]]
tool = "kics"
rule = "3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99"
resources = ["ConfigMap/storage/garage-bootstrap"]
until = 2027-05-15
reason = """False positive: the flagged line is KEY_SECRET =
os.environ["S3_SECRET_KEY"] in the bootstrap script, which reads the key from
the environment (deploy/kustomize/base/garage/bootstrap.py)."""

# ════════════════════════════════════════════════════════════════════════════
# hadolint (inline `# hadolint ignore=` pragmas are not honoured)
# ════════════════════════════════════════════════════════════════════════════

[[exception]]
tool = "hadolint"
rule = "DL3018"
files = ["apps/netagent/Dockerfile"]
until = 2027-05-15
reason = """The setcap stage installs libcap from Alpine 3.22 only to write the
file capability onto the netagent binary; nothing from that stage ships but
the binary. Alpine drops superseded package versions from its mirrors, so an
exact pin would break the build at the next security update; the stage's
base image is pinned by digest instead."""

[[exception]]
tool = "hadolint"
rule = "DL3008"
files = ["deploy/docker/zeek/Dockerfile"]
until = 2027-05-15
reason = """git and libcap2-bin are build tools for zkg and setcap. Debian
drops superseded patch versions between point releases, so exact pins break
the build (the reason already given next to the line); the Zeek base image
tag is fixed."""
