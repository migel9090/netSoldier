apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-inventory
spec:
  template:
    spec:
      containers:
        - name: device-inventory
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
