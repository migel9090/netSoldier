apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-anomaly
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ml-anomaly
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ml-anomaly
    spec:
      serviceAccountName: ml-anomaly
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beacon-sync
          image: ghcr.io/migel9090/ml-anomaly:main
          # step 112: RITA beacon consumer. The FastAPI scoring server
          # (step 115) will be a second container/command on this image.
          command: ["python", "-m", "ml_anomaly.sync"]
          env:
            - name: CLICKHOUSE_URL
              value: "http://clickhouse.netsoldier.svc:8123"
            - name: CLICKHOUSE_DATABASE
              value: "netsoldier"
            - name: RITA_DATABASE
              value: "netsoldier_rita"
            - name: BEACON_SYNC_INTERVAL_SECONDS
              value: "300"
            - name: BEACON_SCORE_THRESHOLD
              value: "0.7"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 96Mi
        - name: flow-anomaly
          image: ghcr.io/migel9090/ml-anomaly:main
          # step 113: Isolation Forest over connection windows; writes
          # ml_anomalies, tailed by detection-engine (step 116).
          command: ["python", "-m", "ml_anomaly.flowsync"]
          env:
            - name: CLICKHOUSE_URL
              value: "http://clickhouse.netsoldier.svc:8123"
            - name: CLICKHOUSE_DATABASE
              value: "netsoldier"
            - name: FLOW_WINDOW_MINUTES
              value: "10"
            - name: FLOW_BASELINE_DAYS
              value: "7"
            - name: FLOW_SYNC_INTERVAL_SECONDS
              value: "600"
            - name: FLOW_SCORE_THRESHOLD
              value: "0.65"
            # step 114: versioned model artifacts survive restarts; the
            # daily retrain only promotes models passing FP/detection bars.
            - name: MODEL_DIR
              value: "/models"
          volumeMounts:
            - name: models
              mountPath: /models
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 192Mi
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ml-models
