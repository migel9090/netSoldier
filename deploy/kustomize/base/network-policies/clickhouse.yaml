# ClickHouse's edges in the core stack. The sensors, ML, RITA, backup,
# cold-export and observability edges live in extras/ with the workloads
# they serve; NetworkPolicies are additive, so a profile that runs those
# gets both.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-clickhouse
  annotations:
    # Created with the server (wave -2) so the migrate Job (wave -1) is
    # admitted on the first sync that introduces it, not one sync later.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HTTP clients, each with its own account: the killswitch's audit
    # forwarder, the detection-engine's ingest and feedback, the
    # inventory's writer and detail queries.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: killswitch-controller
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: detection-engine
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: device-inventory
      ports:
        - port: 8123
          protocol: TCP
    # The schema migration Job (migrate-job.yaml): clickhouse-client only.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
              app.kubernetes.io/component: migrate
      ports:
        - port: 9000
          protocol: TCP
  # The server opens no connection in the core stack (the cold tier on
  # Garage is an extra, extras/clickhouse.yaml).
  egress: []
