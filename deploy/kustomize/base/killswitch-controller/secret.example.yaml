# Documentation only: never applied, never filled in. The lab deployment
# (infra/lab/deploy.sh) generates every value randomly at deploy time and
# applies the Secret directly; an installer must do the same.
#
#   api-key        OPERATOR token (KILLSWITCH_API_KEY): every endpoint except
#                  POST /evaluate and POST /agent/v1/poll, reads included.
#                  Held by the web UI.
#   ingest-token   INGEST token (KILLSWITCH_INGEST_TOKEN): POST /evaluate only.
#                  Held by the detection-engine (its WEBHOOK_TOKEN). Must
#                  differ from api-key, or the engine could approve its own
#                  actions; the service refuses to start otherwise.
#   webhook-secret signature v2 key (WEBHOOK_SECRET), shared with the
#                  detection-engine.
#
# The netagent's token for POST /agent/v1/poll is a credential of its own,
# in the Secret netagent-credentials (key killswitch-token).
#
# A switch adapter (SWITCH_WEBHOOK_URL) would add its own signing key.
apiVersion: v1
kind: Secret
metadata:
  name: killswitch-credentials
type: Opaque
stringData:
  api-key: ""
  ingest-token: ""
  webhook-secret: ""
