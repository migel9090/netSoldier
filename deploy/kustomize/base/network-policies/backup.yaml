apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backup
  policyTypes:
    - Ingress
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # ClickHouse (native protocol for backup)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
              app.kubernetes.io/component: server
      ports:
        - port: 9000
          protocol: TCP
    # Device-inventory API (SQLite state export)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: device-inventory
      ports:
        - port: 8081
          protocol: TCP
    # S3 / MinIO (storage namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: storage
      ports:
        - port: 9000
          protocol: TCP
    # Kubernetes API server (secrets + configmaps export)
    - ports:
        - port: 443
          protocol: TCP
