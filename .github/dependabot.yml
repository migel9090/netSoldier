version: 2

# Every manifest in the repository is covered. Auto-merge is deliberately
# off: every update goes through review and the CI gates like any other PR.
#
# Every ecosystem waits seven days before proposing a newly published
# version (`cooldown`): most malicious releases are found and pulled within
# days. Security updates are not delayed; the cooldown applies to version
# updates only.
#
# No `labels:` keys on purpose. Custom labels that do not exist in the
# repository make Dependabot post an error on every PR; without the key it
# applies its default `dependencies` + ecosystem labels and creates them if
# they are missing.

updates:
  # ── Go modules ────────────────────────────────────────────────
  # One grouped PR across all modules so the go.work workspace stays
  # consistent. Dependabot does not touch the `go` directive, go.work or
  # go.work.sum: after merging, run `go work sync` if the workspace drifted.
  - package-ecosystem: gomod
    directories:
      - /apps/detection-engine
      - /apps/device-inventory
      - /apps/killswitch-controller
      - /apps/threat-intel-sync
      - /apps/netagent
      - /libs/events
      - /tests/e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns:
          - "*"

  # ── Python ────────────────────────────────────────────────────
  # scripts/ci: the hash-pinned tools of the CI gates (requirements.txt).
  - package-ecosystem: pip
    directories:
      - /apps/ml-anomaly
      - /scripts/ci
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"

  # ── Node.js ───────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/web-ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns:
          - "*"

  # ── Docker base images ────────────────────────────────────────
  # The golang: tag is one of the places that carry the single project Go
  # version (go.work is the source of truth; every go.mod matches). A PR
  # bumping it must also bump `go` in go.work and every go.mod. Base images
  # are pinned by digest (tag@sha256); Dependabot moves both. A node: bump
  # must also move node-version in the web-ui job of ci.yml, and a python:
  # bump the python-version of the jobs that test ml-anomaly.
  - package-ecosystem: docker
    directories:
      - /apps/detection-engine
      - /apps/device-inventory
      - /apps/killswitch-controller
      - /apps/threat-intel-sync
      - /apps/netagent
      - /apps/ml-anomaly
      - /apps/web-ui
      - /deploy/docker/zeek
      - /deploy/docker/suricata
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 5
    groups:
      go-base-image:
        patterns:
          - "golang"

  # ── Terraform providers ───────────────────────────────────────
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 5

  # ── GitHub Actions ────────────────────────────────────────────
  # The workflows (/) and the local composite actions they use. Dependabot
  # moves an action's SHA, not values derived from it: the TruffleHog image
  # digest in secret-scan.yml is bumped by hand with its action.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-deps:
        patterns:
          - "*"
