prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 512Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

grafana:
  adminPassword: changeme
  plugins:
    - grafana-clickhouse-datasource
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.observability.svc:3100
      access: proxy
      isDefault: false
    - name: Tempo
      type: tempo
      url: http://tempo.observability.svc:3100
      access: proxy
      isDefault: false
      jsonData:
        nodeGraph:
          enabled: true
    - name: ClickHouse
      type: grafana-clickhouse-datasource
      access: proxy
      isDefault: false
      jsonData:
        defaultDatabase: netsoldier
        port: 9000
        protocol: native
        server: clickhouse.netsoldier.svc
  persistence:
    enabled: true
    size: 1Gi
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true

alertmanager:
  config:
    route:
      receiver: default
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: netsoldier-webhook
          matchers:
            - alertname =~ "CriticalIoCDetected|KillswitchPendingApprovals|DeviceEventsStopped"
          continue: true
    receivers:
      - name: default
      - name: netsoldier-webhook
        webhook_configs:
          - url: http://detection-engine.netsoldier.svc:8080/webhook/alertmanager
            send_resolved: true
  alertmanagerSpec:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

prometheusOperator:
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

# k3s bundles scheduler/controller-manager into the server process
defaultRules:
  create: true
  rules:
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false

kubeScheduler:
  enabled: false

kubeControllerManager:
  enabled: false
