# ── Dockerfile HEALTHCHECK ───────────────────────────────────────────────────

[[exception]]
tool = "checkov"
rule = "CKV_DOCKER_2"
files = [
  "apps/detection-engine/Dockerfile",
  "apps/device-inventory/Dockerfile",
  "apps/killswitch-controller/Dockerfile",
  "apps/threat-intel-sync/Dockerfile",
]
until = 2027-05-15
reason = """Distroless static images: no shell and no HTTP client, so a
HEALTHCHECK has nothing to run until the binary has a health command of its
own, as netagent's `netagent health` does. Kubernetes probes them over HTTP
(/healthz) and ignores HEALTHCHECK; under the lite profile's Podman they have
no health check yet. Remove each file from this list when its service gains
the command."""

[[exception]]
tool = "checkov"
rule = "CKV_DOCKER_2"
files = ["apps/ml-anomaly/Dockerfile", "deploy/docker/zeek/Dockerfile"]
until = 2027-05-15
reason = """Run only by Kubernetes (proxmox-soc), which ignores HEALTHCHECK.
ml-anomaly is one image for three containers on three ports (beacon-sync,
flow-anomaly, scoring-api), each probed on its own port by its manifest; a
single HEALTHCHECK cannot be right for all three. Zeek is a passive sensor
with no endpoint to check."""

