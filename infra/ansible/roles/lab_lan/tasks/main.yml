---
# Only ever on the lab VM: its inventory is generated by Terraform and is the
# only one that carries lab_vm_id. A DHCP server on a real LAN would hand out
# addresses to the household's devices.
- name: Refuse to run outside the lab
  ansible.builtin.assert:
    that:
      - lab_vm_id is defined
      - lab_lan_bridge != lab_lan_uplink
      - lab_lan_uplink in ansible_facts.interfaces
    fail_msg: >-
      lab_lan builds a simulated LAN with its own DHCP server; it runs only on
      the lab VM (an inventory written by `task lab:inventory`).
    quiet: true

# dnsmasq (GPL-2.0/3.0), busybox (GPL-2.0), dig (bind9-dnsutils, MPL-2.0),
# iptables (GPL-2.0), curl (curl licence): the victims use dig and curl.
- name: Install the simulated LAN's tools (dnsmasq, busybox udhcpc, dig, iptables, curl)
  ansible.builtin.apt:
    name:
      - dnsmasq-base
      - busybox
      - bind9-dnsutils
      - iptables
      - curl
    state: present

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ lab_lan_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the LAN script
  ansible.builtin.template:
    src: netsoldier-lab-lan.sh.j2
    dest: /usr/local/sbin/netsoldier-lab-lan
    owner: root
    group: root
    mode: "0755"
  notify: Restart the simulated LAN

- name: Install the scenario's HTTP client (requests as JSON on stdin)
  ansible.builtin.copy:
    src: netsoldier-lab-http
    dest: /usr/local/libexec/netsoldier-lab-http
    owner: root
    group: root
    mode: "0755"

- name: Install the victims' DHCP client hook
  ansible.builtin.template:
    src: udhcpc.sh.j2
    dest: "{{ lab_lan_config_dir }}/udhcpc.sh"
    owner: root
    group: root
    mode: "0755"

- name: Configure the gateway's dnsmasq
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: "{{ lab_lan_config_dir }}/dnsmasq.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart the lab gateway

- name: Install the systemd units
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    owner: root
    group: root
    mode: "0644"
  loop:
    - netsoldier-lab-lan
    - netsoldier-lab-gateway
  notify:
    - Restart the simulated LAN
    - Restart the lab gateway

- name: Load the units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Bring the simulated LAN up and keep it up across reboots
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - netsoldier-lab-lan
    - netsoldier-lab-gateway
