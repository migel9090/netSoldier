apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: clickhouse
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Renders users-override.xml from the ConfigMap template plus the
        # SOPS-encrypted Secret, so no credential or hash is ever committed.
        # Substitution happens here rather than in the image so the
        # placeholders stay visible and reviewable in git.
        - name: render-users
          image: busybox:1.37
          command:
            - sh
            - -ec
            - |
              for var in DEFAULT_PASSWORD_SHA256 WRITER_PASSWORD_SHA256 \
                         READER_PASSWORD_SHA256 RITA_PASSWORD_SHA256 POD_CIDR; do
                eval "value=\$$var"
                if [ -z "$value" ]; then
                  echo "FATAL: $var is empty — refusing to start ClickHouse with a" \
                       "blank credential. Populate the clickhouse-credentials Secret." >&2
                  exit 1
                fi
              done
              sed \
                -e "s|__DEFAULT_PASSWORD_SHA256__|$DEFAULT_PASSWORD_SHA256|g" \
                -e "s|__WRITER_PASSWORD_SHA256__|$WRITER_PASSWORD_SHA256|g" \
                -e "s|__READER_PASSWORD_SHA256__|$READER_PASSWORD_SHA256|g" \
                -e "s|__RITA_PASSWORD_SHA256__|$RITA_PASSWORD_SHA256|g" \
                -e "s|__POD_CIDR__|$POD_CIDR|g" \
                /template/users-override.xml > /rendered/users-override.xml
              # Fail closed if any placeholder survived.
              if grep -q '__[A-Z_]*__' /rendered/users-override.xml; then
                echo "FATAL: unsubstituted placeholder in users-override.xml" >&2
                exit 1
              fi
          env:
            - name: DEFAULT_PASSWORD_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: default-password-sha256
            - name: WRITER_PASSWORD_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: writer-password-sha256
            - name: READER_PASSWORD_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: reader-password-sha256
            - name: RITA_PASSWORD_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: rita-password-sha256
            - name: POD_CIDR
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: pod-cidr
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: users-override
              mountPath: /template
            - name: users-rendered
              mountPath: /rendered
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.3-alpine
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
            - name: native
              containerPort: 9000
              protocol: TCP
          env:
            # S3 credentials for the cold-tier disk (storage.xml sets
            # use_environment_credentials). Optional: without the secret
            # the cold volume is unreachable but the server still runs
            # hot-only (skip_access_check).
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: clickhouse-cold-export-s3
                  key: S3_ACCESS_KEY
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: clickhouse-cold-export-s3
                  key: S3_SECRET_KEY
                  optional: true
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config-override
              mountPath: /etc/clickhouse-server/config.d/memory-limits.xml
              subPath: memory-limits.xml
            - name: storage-config
              mountPath: /etc/clickhouse-server/config.d/storage.xml
              subPath: storage.xml
            - name: users-rendered
              mountPath: /etc/clickhouse-server/users.d/users-override.xml
              subPath: users-override.xml
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
            - name: tmp
              mountPath: /tmp
            - name: log
              mountPath: /var/log/clickhouse-server
      volumes:
        - name: config-override
          configMap:
            name: clickhouse-config
            items:
              - key: memory-limits.xml
                path: memory-limits.xml
        - name: storage-config
          configMap:
            name: clickhouse-config
            items:
              - key: storage.xml
                path: storage.xml
        - name: users-override
          configMap:
            name: clickhouse-config
            items:
              - key: users-override.xml
                path: users-override.xml
        # Holds the rendered users file. A ConfigMap mount is read-only, so
        # the placeholder substitution has to land somewhere writable.
        - name: users-rendered
          emptyDir: {}
        - name: init-sql
          configMap:
            name: clickhouse-init
        - name: tmp
          emptyDir: {}
        - name: log
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
