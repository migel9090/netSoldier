apiVersion: apps/v1
kind: Deployment
metadata:
  name: suricata
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: suricata
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suricata
    spec:
      serviceAccountName: suricata
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-rules
          image: jasonish/suricata:8.0.5
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /var/lib/suricata/data
              # ndjson datasets must never be empty or rules fail to load;
              # sentinel values cannot occur in real traffic
              [ -s /var/lib/suricata/data/ioc-domains.json ] || printf '{"domain":"sentinel.netsoldier.invalid","source":"netsoldier-seed","severity":"unknown","confidence":0}\n' > /var/lib/suricata/data/ioc-domains.json
              [ -s /var/lib/suricata/data/ioc-ips.json ] || printf '{"ip":"192.0.2.254","source":"netsoldier-seed","severity":"unknown","confidence":0}\n' > /var/lib/suricata/data/ioc-ips.json
              suricata-update --no-test --no-reload --disable-conf /etc/suricata/updater/disable.conf
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: updater-script
              mountPath: /etc/suricata/updater
              readOnly: true
            - name: rules
              mountPath: /var/lib/suricata
            - name: run
              mountPath: /var/run/suricata
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
      containers:
        - name: suricata
          image: jasonish/suricata:8.0.5
          command:
            - suricata
            - "-c"
            - /etc/suricata/suricata.yaml
            - "--af-packet"
            - "-v"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_RAW
                - NET_ADMIN
                - SYS_NICE
              drop:
                - ALL
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/suricata/suricata.yaml
              subPath: suricata.yaml
              readOnly: true
            - name: local-rules
              mountPath: /etc/suricata/rules
              readOnly: true
            - name: rules
              mountPath: /var/lib/suricata
              readOnly: true
            - name: log
              mountPath: /var/log/suricata
            - name: run
              mountPath: /var/run/suricata
            - name: tmp
              mountPath: /tmp
        - name: rules-updater
          image: jasonish/suricata:8.0.5
          command: ["python3", "/etc/suricata/updater/update-rules.py"]
          env:
            - name: THREAT_INTEL_URL
              value: "http://threat-intel-sync.netsoldier.svc:8083"
            - name: UPDATE_INTERVAL_SECONDS
              value: "21600"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: updater-script
              mountPath: /etc/suricata/updater
              readOnly: true
            - name: rules
              mountPath: /var/lib/suricata
            - name: run
              mountPath: /var/run/suricata
            - name: tmp
              mountPath: /tmp
        - name: vector
          image: timberio/vector:0.43.1-distroless
          args:
            - "--config-yaml"
            - /etc/vector/vector.yaml
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: vector-config
              mountPath: /etc/vector/vector.yaml
              subPath: vector.yaml
              readOnly: true
            - name: log
              mountPath: /var/log/suricata
              readOnly: true
            - name: vector-data
              mountPath: /var/lib/vector
      volumes:
        - name: config
          configMap:
            name: suricata-config
        - name: local-rules
          configMap:
            name: suricata-local-rules
        - name: updater-script
          configMap:
            name: suricata-updater-script
        - name: vector-config
          configMap:
            name: suricata-vector-config
        - name: rules
          emptyDir: {}
        - name: log
          emptyDir:
            sizeLimit: 500Mi
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: vector-data
          emptyDir:
            sizeLimit: 100Mi
