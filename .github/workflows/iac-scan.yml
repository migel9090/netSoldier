name: IaC Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '55 3 * * 1'

permissions:
  contents: read

# Checkov, KICS and hadolint all run through scripts/ci/iac-gate.py, behind
# the Taskfile targets a developer runs too (task scan:checkov / scan:kics /
# scan:hadolint). It renders every deployable target and judges the rendered
# objects, not the kustomize bases and patch fragments; it scans the rest of
# the repository (Dockerfiles, Terraform, Ansible, workflows, standalone
# manifests) as files; and it fails on every finding that
# scan-exceptions.toml does not cover with a reason and an unexpired review
# date. No baseline, no soft fail. The scanners are pinned by image digest or
# by checksum (scripts/ci/tools.sh) and run without network access.
#
# The SARIF it writes holds only the findings that failed the gate, so the
# code-scanning check and the job always agree. It is uploaded even when the
# gate fails, so the findings show on the pull request.
#
# Egress: block mode where every endpoint a job needs is known from its own
# runs. checkov, kics and infra-lab-static pull images from Docker Hub,
# whose layers come from CDNs that Docker changes without notice (runs so
# far: registry-1.docker.io, auth.docker.io, production.cloudfront.docker.com,
# docker-images-prod.s3.dualstack.us-east-1.amazonaws.com; Docker documents
# docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com
# too). A wrong list would fail every pull request, so those jobs stay in
# audit mode until a few runs confirm the list.

jobs:
  checkov:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/gate-setup

      - name: Checkov
        run: task scan:checkov -- --sarif checkov.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif
          category: checkov

  kics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/gate-setup

      # Gates on HIGH and CRITICAL, as before. The *.example.yaml secrets
      # need no exclusion any more: they are not part of any rendered target,
      # and as files they raise nothing at that level.
      - name: KICS
        run: task scan:kics -- --sarif kics.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('kics.sarif') != ''
        with:
          sarif_file: kics.sarif
          category: kics

  # Every tracked Dockerfile and Containerfile, including the ones under
  # deploy/. Inline `# hadolint ignore=` pragmas are not honoured: they carry
  # no review date, so exceptions go through scan-exceptions.toml.
  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/gate-setup

      - name: hadolint
        run: task scan:hadolint -- --sarif hadolint.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('hadolint.sarif') != ''
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            checkpoint-api.hashicorp.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.terraform.io:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without a version the action installs whatever Terraform is newest,
      # which can fall outside versions.tf's `~> 1.17.2` and changes under an
      # unchanged tree. 1.17.2 is the release infra/lab/tf.sh pins (by image
      # digest) for the lab; keep the three in step.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (providers only)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  # What `task lab:validate` checks, with no credentials and no VM: the
  # pinned lab tools (Ansible from a hash-locked virtualenv, its collections,
  # kubectl by checksum), terraform fmt/init/validate in the digest-pinned
  # image the lab uses (infra/lab/tf.sh), ansible-playbook --syntax-check and
  # ansible-lint of the lab playbooks, and bash -n of the lab scripts.
  # Locations point into the runner's temp directory; LAB_CONFIG is empty.
  infra-lab-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/gate-setup
        with:
          python-deps: 'false'

      - name: Lab static checks (task lab:validate)
        env:
          LAB_VENV: ${{ runner.temp }}/lab/venv
          LAB_STATE: ${{ runner.temp }}/lab/state
          LAB_CACHE: ${{ runner.temp }}/lab/cache
          LAB_CONFIG: ${{ runner.temp }}/lab/config
        run: task lab:validate
