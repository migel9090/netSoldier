name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

# Egress: every job runs harden-runner in block mode with the endpoints it
# was seen to need (step 125.3).

jobs:
  # The whole history on every run, with the pinned gitleaks and the fixed
  # fingerprints of .gitleaksignore. gitleaks-action downloaded whatever
  # gitleaks release was newest and scanned only a pull request's own
  # commits, so the nightly run judged a different history with a different
  # scanner. Same command locally: task scan:secrets.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/gate-setup
        with:
          python-deps: 'false'

      - name: gitleaks
        run: task scan:secrets -- --report-format sarif --report-path gitleaks.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('gitleaks.sarif') != ''
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # No Kubernetes Secret with readable data in any tracked file, no example
  # deployed, and real SOPS recipients (scripts/sops-check.sh). Same command
  # locally: task scan:sops.
  sops-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/gate-setup

      - name: SOPS and plaintext Secrets
        run: task scan:sops

  trufflehog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          extra_args: --only-verified
          # The action runs ghcr.io/trufflesecurity/trufflehog:<version> and
          # defaults to `latest`, so the pinned action ran an unpinned
          # scanner. The value is appended after the colon, which lets it
          # carry the image digest of the release the action is pinned to.
          # Dependabot moves the action, not this line: bump both together
          # (docker buildx imagetools inspect ghcr.io/trufflesecurity/trufflehog:<v>).
          version: 3.99.9@sha256:2ec535840f860aa27f11fee20222fb790326ecd66325c96bd49d02ec6af46eca
