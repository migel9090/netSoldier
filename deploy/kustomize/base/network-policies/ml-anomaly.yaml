apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ml-anomaly
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ml-anomaly
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # OTel/metrics scraping (step 115 adds the FastAPI + /metrics surface)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
  egress:
    # read RITA threat_mixtape + write ml_beacons over the HTTP interface
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
              app.kubernetes.io/component: server
      ports:
        - port: 8123
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
