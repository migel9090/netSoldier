apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush             5
        Grace             10
        Log_Level         info
        Parsers_File      /fluent-bit/etc/parsers.conf
        HTTP_Server       On
        HTTP_Listen       0.0.0.0
        HTTP_Port         2020
        storage.path      /fluent-bit/cache
        storage.sync      normal
        storage.checksum  off
        storage.max_chunks_up  64

    [INPUT]
        Name              systemd
        Tag               journal.netsoldier
        Systemd_Filter    _SYSTEMD_UNIT=detection-engine.service
        Systemd_Filter    _SYSTEMD_UNIT=device-inventory.service
        Systemd_Filter    _SYSTEMD_UNIT=adguard.service
        Read_From_Tail    On
        Strip_Underscores On
        storage.type      filesystem

    [INPUT]
        Name              tail
        Tag               suricata.eve
        Path              /var/log/suricata/eve.json
        Parser            json
        Refresh_Interval  5
        Rotate_Wait       30
        Skip_Empty_Lines  On
        DB                /fluent-bit/cache/suricata-eve.db
        storage.type      filesystem

    [FILTER]
        Name              parser
        Match             journal.*
        Key_Name          MESSAGE
        Parser            json
        Reserve_Data      On
        Preserve_Key      Off

    [FILTER]
        Name              modify
        Match             *
        Add               _edge_host ${HOSTNAME}
        Add               _profile pi-edge

    [FILTER]
        Name              modify
        Match             suricata.*
        Add               _source suricata

    [FILTER]
        Name              modify
        Match             journal.*
        Rename            SYSTEMD_UNIT _source

    [OUTPUT]
        Name              forward
        Match             *
        Host              ${VECTOR_HOST}
        Port              ${VECTOR_PORT}
        Retry_Limit       5
        storage.total_limit_size  50M

  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

    [PARSER]
        Name        json_notime
        Format      json

    [PARSER]
        Name        suricata_eve
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On
