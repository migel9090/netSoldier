apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection-engine
spec:
  template:
    spec:
      containers:
        - name: detection-engine
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
