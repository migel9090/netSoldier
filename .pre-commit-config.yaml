# Pre-commit hooks — security scanners + formatters.
#
# Install:  pip install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
# Update:   pre-commit autoupdate
#
# Heavy hooks (semgrep, checkov) also run in CI (steps 15–17).
# To skip them locally for a quick commit:
#   SKIP=semgrep,checkov git commit -m "..."

default_language_version:
  python: python3

repos:
  # ── Standard checks ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: detect-private-key
      - id: check-symlinks
      - id: check-executables-have-shebangs

  # ── Secrets — gitleaks ───────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── SAST — semgrep ──────────────────────────────────────────────
  # Requires network on first run (downloads rule packs).
  - repo: https://github.com/semgrep/semgrep
    rev: v1.96.0
    hooks:
      - id: semgrep
        args: ['--config', 'auto', '--error', '--metrics', 'off']

  # ── IaC — checkov ───────────────────────────────────────────────
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.312
    hooks:
      - id: checkov
        args: ['--quiet', '--compact']

  # ── Dockerfile — hadolint ───────────────────────────────────────
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker

  # ── Go — gofmt + goimports ──────────────────────────────────────
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-imports

  # ── Python — ruff (lint + format, replaces black + isort + flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ── JS/TS/Svelte — prettier ─────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, typescript, css, json, yaml, markdown]
        additional_dependencies:
          - prettier-plugin-svelte
