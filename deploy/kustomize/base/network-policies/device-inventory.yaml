# device-inventory's edges. The agent's ingest (netagent, on the host
# network, so not selectable by a podSelector) is admitted by an ipBlock in
# components/site, from the site's HOST_NETWORK_SOURCE_CIDR.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-device-inventory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: device-inventory
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web-ui
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: detection-engine
      ports:
        - port: 8081
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
              app.kubernetes.io/component: server
      ports:
        - port: 8123
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
