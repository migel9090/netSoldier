name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Validate deploy configs
        run: pip install --quiet pyyaml jsonschema && python scripts/validate-configs.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: apps/detection-engine/go.mod
          cache-dependency-path: apps/*/go.sum

      - name: Go vet
        run: |
          for dir in apps/*/; do
            if find "$dir" -name '*.go' -print -quit | grep -q .; then
              echo "::group::vet $dir"
              (cd "$dir" && go vet ./...)
              echo "::endgroup::"
            fi
          done

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Ruff lint
        run: pip install --quiet ruff && ruff check apps/ml-anomaly/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: apps/detection-engine/go.mod
          cache-dependency-path: apps/*/go.sum

      - name: Go test with coverage
        run: |
          for dir in apps/*/; do
            if find "$dir" -name '*_test.go' -print -quit | grep -q .; then
              echo "::group::test $dir"
              (cd "$dir" && go test -race -count=1 -coverprofile=coverage.out ./...)
              echo "::endgroup::"
            elif find "$dir" -name '*.go' -print -quit | grep -q .; then
              echo "::group::test $dir"
              (cd "$dir" && go test -race -count=1 ./...)
              echo "::endgroup::"
            fi
          done

      - name: Go coverage gate (≥70% critical packages)
        run: |
          fail=0
          for pkg in \
            apps/detection-engine/internal/iocmatch \
            apps/killswitch-controller/internal/policy \
            apps/killswitch-controller/internal/actions \
            apps/threat-intel-sync/internal/ioc; do
            cover=$(cd "$(echo "$pkg" | cut -d/ -f1-2)" && go test -cover "./$(echo "$pkg" | cut -d/ -f3-)/" 2>&1 | grep -oP '\d+\.\d+(?=%)' || echo "0")
            echo "$pkg: ${cover}%"
            if [ "$(echo "$cover < 70" | bc)" -eq 1 ]; then
              echo "::error::Coverage for $pkg is ${cover}% (minimum 70%)"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Python test
        working-directory: apps/ml-anomaly
        run: |
          pip install --quiet -e '.[dev]'
          pytest --tb=short -q

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: apps/detection-engine/go.mod
          cache-dependency-path: |
            tests/e2e/go.sum
            apps/*/go.sum

      - name: End-to-end tests (Phase 1)
        working-directory: tests/e2e
        env:
          GOWORK: "off"
        run: go test -v -tags=e2e -count=1 -timeout=300s .

  integration:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: apps/detection-engine/go.mod
          cache-dependency-path: |
            tests/e2e/go.sum
            apps/*/go.sum

      - name: Integration tests (ephemeral ClickHouse)
        working-directory: tests/e2e
        env:
          GOWORK: "off"
        run: go test -v -tags=integration -count=1 -timeout=300s .

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/detection-engine
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: build
        with:
          # Repo root: apps/detection-engine/go.mod replaces libs/events with a
          # relative path, so that module must be inside the build context.
          # .dockerignore keeps the context to just apps/ + libs/.
          context: .
          file: apps/detection-engine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image
        if: github.event_name == 'push'
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/detection-engine@${{ steps.build.outputs.digest }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        if: github.event_name == 'push'
        with:
          image: ghcr.io/${{ github.repository_owner }}/detection-engine:main
          format: cyclonedx-json
          artifact-name: sbom-detection-engine
          output-file: detection-engine.cdx.json

  provenance:
    if: github.event_name == 'push'
    needs: build
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/${{ github.repository_owner }}/detection-engine
      digest: ${{ needs.build.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-ml-anomaly:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ml-anomaly
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: build
        with:
          context: apps/ml-anomaly
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ml-anomaly
          cache-to: type=gha,scope=ml-anomaly,mode=max

      - name: Sign image
        if: github.event_name == 'push'
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/ml-anomaly@${{ steps.build.outputs.digest }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        if: github.event_name == 'push'
        with:
          image: ghcr.io/${{ github.repository_owner }}/ml-anomaly:main
          format: cyclonedx-json
          artifact-name: sbom-ml-anomaly
          output-file: ml-anomaly.cdx.json

  provenance-ml-anomaly:
    if: github.event_name == 'push'
    needs: build-ml-anomaly
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/${{ github.repository_owner }}/ml-anomaly
      digest: ${{ needs.build-ml-anomaly.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-zeek:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/zeek
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: build
        with:
          context: deploy/docker/zeek
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=zeek
          cache-to: type=gha,scope=zeek,mode=max

      # Golden test for the first-party JA4 implementation: replay pinned
      # pcaps through the freshly built image and diff against fingerprints
      # cross-validated with Wireshark. Runs before the image is signed.
      - name: Test JA4 fingerprinting
        run: deploy/docker/zeek/test/run.sh "$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"

      - name: Sign image
        if: github.event_name == 'push'
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/zeek@${{ steps.build.outputs.digest }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        if: github.event_name == 'push'
        with:
          image: ghcr.io/${{ github.repository_owner }}/zeek:main
          format: cyclonedx-json
          artifact-name: sbom-zeek
          output-file: zeek.cdx.json

  provenance-zeek:
    if: github.event_name == 'push'
    needs: build-zeek
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/${{ github.repository_owner }}/zeek
      digest: ${{ needs.build-zeek.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
