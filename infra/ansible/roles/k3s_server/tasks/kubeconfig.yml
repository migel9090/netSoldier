---
- name: Wait for node to be Ready
  ansible.builtin.command:
    cmd: k3s kubectl wait --for=condition=Ready node --all --timeout=120s
  changed_when: false

- name: Read kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: kubeconfig_raw

- name: Write kubeconfig with external IP
  ansible.builtin.copy:
    content: "{{ kubeconfig_raw.content | b64decode | replace('127.0.0.1', k3s_tls_san) }}"
    dest: /etc/rancher/k3s/k3s-external.yaml
    mode: "0600"

- name: Fetch kubeconfig to controller
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s-external.yaml
    dest: "{{ k3s_kubeconfig_local_path }}"
    flat: true
