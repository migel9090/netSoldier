# Custom parsers for netSoldier edge data sources.

[PARSER]
    Name        json
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

[PARSER]
    Name        json_notime
    Format      json

# Suricata EVE timestamp format: "2026-03-15T10:30:00.123456+0200"
[PARSER]
    Name        suricata_eve
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On
