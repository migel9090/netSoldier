apiVersion: v1
kind: ConfigMap
metadata:
  name: netsoldier-dpi-protocols
  labels:
    grafana_dashboard: "1"
data:
  netsoldier-dpi-protocols.json: |-
    {
      "uid": "netsoldier-dpi-protocols",
      "title": "netSoldier — DPI & Protocols",
      "tags": ["netsoldier", "dpi", "protocols"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "editable": true,
      "time": { "from": "now-6h", "to": "now" },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "clickhouse",
            "type": "datasource",
            "query": "grafana-clickhouse-datasource",
            "current": { "selected": true, "text": "ClickHouse", "value": "ClickHouse" }
          }
        ]
      },
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "L7 Protocol Mix (Zeek)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false
        },
        {
          "id": 1,
          "type": "stat",
          "title": "Distinct L7 Services",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT uniqExact(service) AS services FROM netsoldier.zeek_conn WHERE $__timeFilter(timestamp) AND service != ''",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "TLS Sessions",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT count() AS tls_sessions FROM netsoldier.zeek_ssl WHERE $__timeFilter(timestamp)",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null } ] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "HTTP Requests",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT count() AS http_requests FROM netsoldier.zeek_http WHERE $__timeFilter(timestamp)",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [ { "color": "yellow", "value": null } ] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Intel Framework Hits",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT count() AS intel_hits FROM netsoldier.zeek_intel WHERE $__timeFilter(timestamp)",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Connections by L7 Service",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 9, "w": 14, "x": 0, "y": 5 },
          "targets": [
            {
              "editorType": "sql",
              "format": 2,
              "queryType": "sql",
              "rawSql": "SELECT $__timeInterval(timestamp) AS time, if(service = '', 'unknown', service) AS svc, count() AS connections FROM netsoldier.zeek_conn WHERE $__timeFilter(timestamp) GROUP BY time, svc ORDER BY time",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 15, "showPoints": "never", "stacking": { "mode": "normal" } }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "id": 6,
          "type": "bargauge",
          "title": "Top L7 Services by Bytes",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 9, "w": 10, "x": 14, "y": 5 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT if(service = '', 'unknown', service) AS svc, sum(orig_bytes + resp_bytes) AS total_bytes FROM netsoldier.zeek_conn WHERE $__timeFilter(timestamp) GROUP BY svc ORDER BY total_bytes DESC LIMIT 10",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "color": { "mode": "continuous-blues" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "displayMode": "gradient", "orientation": "horizontal", "showUnfilled": true, "valueMode": "text" }
        },
        {
          "id": 200,
          "type": "row",
          "title": "Suricata App-Layer",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "collapsed": false
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Alerts by App Protocol",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 15 },
          "targets": [
            {
              "editorType": "sql",
              "format": 2,
              "queryType": "sql",
              "rawSql": "SELECT $__timeInterval(timestamp) AS time, if(app_proto = '' OR app_proto = 'failed', 'unknown', app_proto) AS proto, count() AS alerts FROM netsoldier.suricata_alerts WHERE $__timeFilter(timestamp) GROUP BY time, proto ORDER BY time",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "bars", "fillOpacity": 60, "showPoints": "never", "stacking": { "mode": "normal" } }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "id": 8,
          "type": "table",
          "title": "Top Alert Signatures by App Protocol",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 15 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT alert_signature, if(app_proto = '' OR app_proto = 'failed', 'unknown', app_proto) AS app_proto, count() AS hits, min(alert_severity) AS severity FROM netsoldier.suricata_alerts WHERE $__timeFilter(timestamp) GROUP BY alert_signature, app_proto ORDER BY hits DESC LIMIT 15",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              { "matcher": { "id": "byName", "options": "alert_signature" }, "properties": [ { "id": "displayName", "value": "Signature" } ] },
              { "matcher": { "id": "byName", "options": "app_proto" }, "properties": [ { "id": "displayName", "value": "App Proto" } ] },
              { "matcher": { "id": "byName", "options": "hits" }, "properties": [ { "id": "displayName", "value": "Hits" } ] },
              { "matcher": { "id": "byName", "options": "severity" }, "properties": [
                { "id": "displayName", "value": "Severity" },
                { "id": "custom.cellOptions", "value": { "type": "color-text" } },
                { "id": "mappings", "value": [ { "type": "value", "options": { "1": { "color": "dark-red", "text": "1 (high)" }, "2": { "color": "orange", "text": "2 (medium)" }, "3": { "color": "yellow", "text": "3 (low)" } } } ] }
              ] }
            ]
          },
          "options": { "showHeader": true, "sortBy": [{ "displayName": "Hits", "desc": true }], "footer": { "show": false } }
        },
        {
          "id": 300,
          "type": "row",
          "title": "HTTP (Zeek)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 24 },
          "collapsed": false
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "HTTP Status Classes",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 9, "w": 8, "x": 0, "y": 25 },
          "targets": [
            {
              "editorType": "sql",
              "format": 2,
              "queryType": "sql",
              "rawSql": "SELECT $__timeInterval(timestamp) AS time, multiIf(status_code >= 500, '5xx', status_code >= 400, '4xx', status_code >= 300, '3xx', status_code >= 200, '2xx', 'other') AS class, count() AS requests FROM netsoldier.zeek_http WHERE $__timeFilter(timestamp) GROUP BY time, class ORDER BY time",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "bars", "fillOpacity": 60, "showPoints": "never", "stacking": { "mode": "normal" } }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "id": 10,
          "type": "table",
          "title": "Top HTTP Hosts",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 9, "w": 8, "x": 8, "y": 25 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT host, count() AS requests, uniqExact(src_ip) AS clients, sum(response_body_len) AS bytes FROM netsoldier.zeek_http WHERE $__timeFilter(timestamp) AND host != '' GROUP BY host ORDER BY requests DESC LIMIT 15",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              { "matcher": { "id": "byName", "options": "host" }, "properties": [ { "id": "displayName", "value": "Host" } ] },
              { "matcher": { "id": "byName", "options": "requests" }, "properties": [ { "id": "displayName", "value": "Requests" } ] },
              { "matcher": { "id": "byName", "options": "clients" }, "properties": [ { "id": "displayName", "value": "Clients" } ] },
              { "matcher": { "id": "byName", "options": "bytes" }, "properties": [ { "id": "displayName", "value": "Bytes" }, { "id": "unit", "value": "bytes" } ] }
            ]
          },
          "options": { "showHeader": true, "sortBy": [{ "displayName": "Requests", "desc": true }], "footer": { "show": false } }
        },
        {
          "id": 11,
          "type": "table",
          "title": "Low-Frequency User-Agents",
          "description": "User-Agents seen in ≤5 requests — plain-HTTP tooling, droppers and scanners often show up here.",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 9, "w": 8, "x": 16, "y": 25 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT user_agent, count() AS requests, uniqExact(src_ip) AS clients FROM netsoldier.zeek_http WHERE $__timeFilter(timestamp) AND user_agent != '' GROUP BY user_agent HAVING requests <= 5 ORDER BY requests ASC, user_agent ASC LIMIT 15",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              { "matcher": { "id": "byName", "options": "user_agent" }, "properties": [ { "id": "displayName", "value": "User-Agent" } ] },
              { "matcher": { "id": "byName", "options": "requests" }, "properties": [ { "id": "displayName", "value": "Requests" } ] },
              { "matcher": { "id": "byName", "options": "clients" }, "properties": [ { "id": "displayName", "value": "Clients" } ] }
            ]
          },
          "options": { "showHeader": true, "footer": { "show": false } }
        },
        {
          "id": 400,
          "type": "row",
          "title": "ntopng (live nDPI)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 34 },
          "collapsed": false
        },
        {
          "id": 12,
          "type": "text",
          "title": "ntopng Community Edition",
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 35 },
          "options": {
            "mode": "markdown",
            "content": "**ntopng CE** is the live nDPI/L7 operations UI (`kubectl -n netsoldier port-forward svc/ntopng 3001:3001`). The Community Edition cannot export flows to ClickHouse (Enterprise-only feature, see COMPLIANCE.md), so the historical DPI data on this dashboard comes from **Zeek** (`zeek_conn.service`, `zeek_http`, `zeek_ssl`) and **Suricata** (`suricata_alerts.app_proto`)."
          }
        }
      ]
    }
