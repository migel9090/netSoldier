---
- name: Reload sshd
  ansible.builtin.systemd_service:
    name: "{{ hardening_ssh_service }}"
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted

- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true
