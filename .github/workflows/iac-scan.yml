name: IaC Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '55 3 * * 1'

permissions:
  contents: read

# Checkov, KICS and hadolint all run through scripts/ci/iac-gate.py, the
# command a developer runs too (task scan:checkov / scan:kics / scan:hadolint).
# It renders every deployable target and judges the rendered objects, not the
# kustomize bases and patch fragments; it scans the rest of the repository
# (Dockerfiles, Terraform, Ansible, workflows, standalone manifests) as files;
# and it fails on every finding that scan-exceptions.toml does not cover with
# a reason and an unexpired review date. No baseline, no soft fail. The
# scanners are pinned by image digest or by checksum (scripts/ci/tools.sh)
# and run without network access.
#
# The SARIF it writes holds only the findings that failed the gate, so the
# code-scanning check and the job always agree. It is uploaded even when the
# gate fails, so the findings show on the pull request.

jobs:
  checkov:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install the gate's Python tools
        run: pip install --quiet --require-hashes -r scripts/ci/requirements.txt

      - name: Checkov
        env:
          NETSOLDIER_TOOLS: ${{ runner.temp }}/tools
        run: python scripts/ci/iac-gate.py checkov --sarif checkov.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4.36.1
        if: always() && hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif
          category: checkov

  kics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install the gate's Python tools
        run: pip install --quiet --require-hashes -r scripts/ci/requirements.txt

      # Gates on HIGH and CRITICAL, as before. The *.example.yaml secrets
      # need no exclusion any more: they are not part of any rendered target,
      # and as files they raise nothing at that level.
      - name: KICS
        env:
          NETSOLDIER_TOOLS: ${{ runner.temp }}/tools
        run: python scripts/ci/iac-gate.py kics --sarif kics.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4.36.1
        if: always() && hashFiles('kics.sarif') != ''
        with:
          sarif_file: kics.sarif
          category: kics

  # Every tracked Dockerfile and Containerfile, including the ones under
  # deploy/. Inline `# hadolint ignore=` pragmas are not honoured: they carry
  # no review date, so exceptions go through scan-exceptions.toml.
  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install the gate's Python tools
        run: pip install --quiet --require-hashes -r scripts/ci/requirements.txt

      - name: hadolint
        env:
          NETSOLDIER_TOOLS: ${{ runner.temp }}/tools
        run: python scripts/ci/iac-gate.py hadolint --sarif hadolint.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4.36.1
        if: always() && hashFiles('hadolint.sarif') != ''
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Without a version the action installs whatever Terraform is newest,
      # which can fall outside versions.tf's `~> 1.17.2` and changes under an
      # unchanged tree. 1.17.2 is the release infra/lab/tf.sh pins (by image
      # digest) for the lab; keep the three in step.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (providers only)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
