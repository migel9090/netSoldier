# Example only — the real Secret is SOPS-encrypted and never committed in
# plaintext. Copy to secret.sops.yaml, fill in real values, then
# `sops -e -i secret.sops.yaml`.
#
# Every value here is load-bearing for safety:
#
#   api-key        authenticates POST /evaluate, /approve, /reject, /revert.
#                  Without it the controller logs an error and serves those
#                  endpoints to anyone who can reach port 8084.
#   webhook-secret verifies the HMAC on detection events, so a tampered
#                  payload cannot raise confidence or re-target an action.
#                  Must match the detection-engine's WEBHOOK_SECRET.
#   switch-secret  signs switch-port operations (disable_port /
#                  quarantine_vlan) so the webhook handler can tell a genuine
#                  instruction from a forged one. Only needed when
#                  SWITCH_WEBHOOK_URL is configured.
apiVersion: v1
kind: Secret
metadata:
  name: killswitch-credentials
type: Opaque
stringData:
  api-key: "CHANGE-ME-generate-with-openssl-rand-base64-32"
  webhook-secret: "CHANGE-ME-must-match-detection-engine-WEBHOOK_SECRET"
  switch-secret: "CHANGE-ME-only-needed-with-SWITCH_WEBHOOK_URL"
