# Example only — the real Secret is SOPS-encrypted and never committed in
# plaintext. Copy to secret.sops.yaml, fill in real values, then
# `sops -e -i secret.sops.yaml`.
#
# ClickHouse holds the DNS query log, the flow records and the enforcement
# audit log — the whole evidentiary record of the monitor. Until now the
# `default` user was passwordless and a `rita` admin account was open to
# ::/0 with no password at all, so anything that could reach port 8123 could
# read every household member's browsing history and delete the audit trail.
#
# Generate a password and its hash together:
#
#   pw=$(openssl rand -base64 32)
#   echo "password: $pw"
#   echo -n "$pw" | sha256sum | cut -d' ' -f1   # the *_sha256 value
#
# The *_sha256 values go into users-override.xml via the init container; the
# plaintext values are what the services authenticate with.
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
type: Opaque
stringData:
  # Local-only administrative account.
  default-password: "CHANGE-ME"
  default-password-sha256: "CHANGE-ME-sha256-of-the-above"

  # Ingest account used by detection-engine, device-inventory,
  # killswitch-controller and the cold-export CronJob.
  writer-username: "writer"
  writer-password: "CHANGE-ME"
  writer-password-sha256: "CHANGE-ME-sha256-of-the-above"

  # Read-only account for Grafana and the web UI.
  reader-username: "reader"
  reader-password: "CHANGE-ME"
  reader-password-sha256: "CHANGE-ME-sha256-of-the-above"

  # RITA importer: owns its own databases only.
  rita-username: "rita"
  rita-password: "CHANGE-ME"
  rita-password-sha256: "CHANGE-ME-sha256-of-the-above"

  # Pod CIDR allowed to authenticate. Narrow this to your cluster's pod
  # network; ::/0 means "anywhere", which is what the rita account used to
  # allow.
  pod-cidr: "10.42.0.0/16"
