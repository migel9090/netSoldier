# Example only — NOT referenced by kustomization.yaml. Create the real
# secret via SOPS (see .sops.yaml) or manually:
#   kubectl -n storage create secret generic minio-root \
#     --from-literal=MINIO_ROOT_USER=... \
#     --from-literal=MINIO_ROOT_PASSWORD=...
# The same credentials belong in the clickhouse-cold-export-s3 and
# backup-s3 secrets (S3_ACCESS_KEY / S3_SECRET_KEY) in the netsoldier
# namespace.
apiVersion: v1
kind: Secret
metadata:
  name: minio-root
  namespace: storage
type: Opaque
stringData:
  MINIO_ROOT_USER: "changeme"
  MINIO_ROOT_PASSWORD: "changeme"
