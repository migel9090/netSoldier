apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeek
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zeek
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zeek
    spec:
      serviceAccountName: zeek
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # seed /var/intel/intel.dat before zeek starts so the Intel
        # framework never sees a missing file; on failure fall back to
        # a header-only file (the sidecar retries every 15 min).
        - name: intel-init
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              curl -fsS --max-time 30 -o /var/intel/intel.dat \
                "http://threat-intel-sync.netsoldier.svc:8083/export/zeek/intel.dat" \
              || printf '#fields\tindicator\tindicator_type\tmeta.source\tmeta.desc\tmeta.url\n' \
                   > /var/intel/intel.dat
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: intel
              mountPath: /var/intel
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi
        # the zeek image ships no setcap and the binary has no file
        # capabilities, so non-root capture would fail with EPERM;
        # copy the binary and write the security.capability xattr
        # (equivalent of: setcap cap_net_raw,cap_net_admin+ep)
        - name: init-caps
          image: ghcr.io/migel9090/zeek:main
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cp /usr/local/zeek/bin/zeek /opt/zeek-cap/zeek
              chmod 755 /opt/zeek-cap/zeek
              python3 - <<'PY'
              import os, struct
              # vfs_cap_data v2 + VFS_CAP_FLAGS_EFFECTIVE;
              # permitted = CAP_NET_ADMIN (12) | CAP_NET_RAW (13)
              data = struct.pack('<5I', 0x02000001, (1 << 12) | (1 << 13), 0, 0, 0)
              os.setxattr('/opt/zeek-cap/zeek', 'security.capability', data)
              PY
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add:
                - SETFCAP
              drop:
                - ALL
          volumeMounts:
            - name: zeek-cap
              mountPath: /opt/zeek-cap
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 64Mi
      containers:
        - name: zeek
          image: ghcr.io/migel9090/zeek:main
          command:
            - /opt/zeek-cap/zeek
            - "-i"
            - af_packet::eth1
            - /etc/zeek-site/netsoldier.zeek
          workingDir: /var/log/zeek
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_RAW
                - NET_ADMIN
              drop:
                - ALL
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 384Mi
          volumeMounts:
            - name: zeek-cap
              mountPath: /opt/zeek-cap
              readOnly: true
            - name: site
              mountPath: /etc/zeek-site
              readOnly: true
            - name: intel
              mountPath: /var/intel
              readOnly: true
            - name: log
              mountPath: /var/log/zeek
            - name: tmp
              mountPath: /tmp
        # refresh the Intel indicator file; atomic rename triggers the
        # input framework's re-read on the zeek side
        - name: intel-sync
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                sleep 900
                if curl -fsS --max-time 30 -o /var/intel/intel.dat.tmp \
                     "http://threat-intel-sync.netsoldier.svc:8083/export/zeek/intel.dat"; then
                  mv /var/intel/intel.dat.tmp /var/intel/intel.dat
                fi
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: intel
              mountPath: /var/intel
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
        - name: vector
          image: timberio/vector:0.43.1-distroless-libc
          args:
            - "--config-yaml"
            - /etc/vector/vector.yaml
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: vector-config
              mountPath: /etc/vector/vector.yaml
              subPath: vector.yaml
              readOnly: true
            - name: log
              mountPath: /var/log/zeek
              readOnly: true
            - name: vector-data
              mountPath: /var/lib/vector
      volumes:
        - name: site
          configMap:
            name: zeek-config
            defaultMode: 493
        - name: intel
          emptyDir:
            sizeLimit: 200Mi
        - name: vector-config
          configMap:
            name: zeek-vector-config
        - name: zeek-cap
          emptyDir:
            sizeLimit: 500Mi
        - name: log
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir: {}
        - name: vector-data
          emptyDir:
            sizeLimit: 100Mi
