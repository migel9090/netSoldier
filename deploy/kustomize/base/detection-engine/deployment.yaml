apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: detection-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detection-engine
    spec:
      serviceAccountName: detection-engine
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: detection-engine
          image: ghcr.io/migel9090/detection-engine:main
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: ADGUARD_URL
              value: "http://adguard-web.dns.svc:3000"
            - name: ADGUARD_USER
              valueFrom:
                secretKeyRef:
                  name: adguard-credentials
                  key: username
            - name: ADGUARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adguard-credentials
                  key: password
            - name: THREATLIST_PATH
              value: "/etc/detection-engine/domains.txt"
            - name: POLL_INTERVAL
              value: "30s"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector.observability.svc:4317"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: threatlist
              mountPath: /etc/detection-engine
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: threatlist
          configMap:
            name: detection-engine-threatlist
        - name: tmp
          emptyDir: {}
