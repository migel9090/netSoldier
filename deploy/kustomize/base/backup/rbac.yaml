apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-reader
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-reader
subjects:
  - kind: ServiceAccount
    name: backup
    namespace: netsoldier
