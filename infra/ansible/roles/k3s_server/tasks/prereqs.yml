---
- name: Load container kernel modules now and on boot
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - overlay
    - br_netfilter

- name: Container networking sysctl
  ansible.builtin.copy:
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    dest: /etc/sysctl.d/99-k3s.conf
    mode: "0644"
  notify: Reload sysctl

- name: Check for active swap
  ansible.builtin.command: swapon --show --noheadings
  register: k3s_swap
  changed_when: false

- name: Disable swap
  ansible.builtin.command: swapoff -a
  when: k3s_swap.stdout | length > 0
  changed_when: true

- name: Remove swap from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent
