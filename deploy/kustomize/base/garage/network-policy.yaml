# The storage namespace mirrors the netsoldier default-deny posture: Garage
# accepts S3 traffic only from the workloads that ship data to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-garage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garage
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    # ClickHouse server (native cold-tier moves + historical reads),
    # cold-export CronJob (Parquet archive) and backup CronJob.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: netsoldier
      ports:
        - port: 3900
          protocol: TCP
    # Same-namespace bootstrap Job, which drives the admin API.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: bucket-init
      ports:
        - port: 3903
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-garage-bucket-init
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garage
      app.kubernetes.io/component: bucket-init
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: server
      ports:
        - port: 3903
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
