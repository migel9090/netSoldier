# The web UI's egress to the three backends. Who may reach it is the site's
# decision: components/site admits the site's LAN (LAN_CIDR) on 3000, and
# nothing else; without a site nothing reaches it (default-deny).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-ui
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: detection-engine
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: device-inventory
      ports:
        - port: 8081
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: killswitch-controller
      ports:
        - port: 8084
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
