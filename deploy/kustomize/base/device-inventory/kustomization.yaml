apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonLabels:
  app.kubernetes.io/name: device-inventory
  app.kubernetes.io/part-of: netsoldier

# The ServiceMonitor lives in base/observability: it needs the Prometheus
# Operator's CRDs, which a cluster without the observability stack lacks.
resources:
  - serviceaccount.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
