# Resources only: device-inventory holds no capability on any profile
# (ADR-0004); netagent captures.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-inventory
  namespace: netsoldier
spec:
  template:
    spec:
      containers:
        - name: device-inventory
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
