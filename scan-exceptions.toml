# ════════════════════════════════════════════════════════════════════════════
# hadolint (inline `# hadolint ignore=` pragmas are not honoured)
# ════════════════════════════════════════════════════════════════════════════

[[exception]]
tool = "hadolint"
rule = "DL3018"
files = ["apps/netagent/Dockerfile"]
until = 2027-05-15
reason = """The setcap stage installs libcap from Alpine 3.22 only to write the
file capability onto the netagent binary; nothing from that stage ships but
the binary. Alpine drops superseded package versions from its mirrors, so an
exact pin would break the build at the next security update; the stage's
base image is pinned by digest instead."""

[[exception]]
tool = "hadolint"
rule = "DL3008"
files = ["deploy/docker/zeek/Dockerfile"]
until = 2027-05-15
reason = """Two unpinned apt installs: libcap2-bin (setcap) in the build stage,
and in the runtime the Debian shared libraries the upstream zeek binary links
against. Debian keeps only the current version of a package in its archive,
so an exact pin breaks the build at the next security update (the reason is
also given next to the lines); the base images are pinned by digest, and the
build fails if a library the binary needs is missing (ldd check)."""

[[exception]]
tool = "hadolint"
rule = "DL3008"
files = ["deploy/docker/suricata/Dockerfile"]
until = 2027-05-15
reason = """Suricata and suricata-update from trixie-backports, and libcap2-bin
(setcap), removed again in the same layer. Debian keeps only the current
version of a package in its archive (backports included), so an exact pin
breaks the build at the next security update; the base image is pinned by
digest, and test/run.sh asserts the Suricata major version."""

