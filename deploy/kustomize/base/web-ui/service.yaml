apiVersion: v1
kind: Service
metadata:
  name: web-ui
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
    # Scraped in-cluster only (ServiceMonitor web-ui); never published.
    - port: 9464
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: web-ui
