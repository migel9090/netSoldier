apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-intel-sync
spec:
  template:
    spec:
      containers:
        - name: threat-intel-sync
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
