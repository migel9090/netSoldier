# Exceptions for the scan gates: Checkov, KICS and hadolint
# (scripts/ci/iac-gate.py, run by .github/workflows/iac-scan.yml and by
# `task scan:iac`), Semgrep (the same script, sast.yml, `task scan:sast`)
# and the SOPS check (scripts/sops-check.sh, secret-scan.yml,
# `task scan:sops`).
#
# The gates fail on every finding that is not listed here (KICS: on HIGH and
# CRITICAL). Fix a finding when it can be fixed; an entry is acceptable only
# for something deliberate, documented where it is decided, or a false
# positive, and says why in words a reviewer can check against the manifest.
# There is no baseline: nothing is excepted because it already existed.
#
# Every entry carries a review date (`until`, at most a year ahead). After it
# the entry no longer applies, the findings it covered fail again, and the
# gate says the entry expired, like osv-scanner's ignoreUntil in
# osv-scanner.toml. An entry that matches nothing any more is reported as a
# warning so it can be shrunk.
#
# Scope is as narrow as the finding allows:
#   resources  Kubernetes objects as Kind/namespace/name, the identity they
#              have in every rendered target (scripts/ci/render-manifests.sh)
#              and in standalone manifests; a new workload is never covered
#              by an old entry
#   files      repository paths, for findings outside Kubernetes manifests
#
#   [[exception]]
#   tool = "checkov"            # checkov | kics | hadolint | semgrep | sops
#   rule = "CKV_K8S_19"         # Checkov id, KICS query id, hadolint code,
#                               # Semgrep registry rule id, sops-check rule
#   resources = ["DaemonSet/netsoldier/netagent"]
#   until = 2027-05-15
#   reason = """Why it is deliberate, where that is decided."""
#
# KICS query ids belong to the pinned KICS release (scripts/ci/tools.sh);
# some change between releases, so re-check these entries when bumping it.

# ════════════════════════════════════════════════════════════════════════════
# Checkov
# ════════════════════════════════════════════════════════════════════════════

# ── Raw network access: netagent (ADR-0004) ──────────────────────────────────

[[exception]]
tool = "checkov"
rule = "CKV_K8S_19"
resources = ["DaemonSet/netsoldier/netagent"]
until = 2027-05-15
reason = """Host network namespace. ADR-0004: netagent is the one first-party
component with raw network access, because it has to see and answer ARP and
DHCP on the household LAN, which only the node's own network namespace
carries. It listens on no port, runs non-root on the default runtime with
every capability dropped but NET_RAW, and nothing else first-party shares the
host network (deploy/README.md, runtime rules)."""

[[exception]]
tool = "checkov"
rule = "CKV_K8S_25"
resources = ["DaemonSet/netsoldier/netagent"]
until = 2027-05-15
reason = """Adds NET_RAW and nothing else (ADR-0004, point 6): the raw socket
netagent captures and sends ARP/DHCP frames with. The image bakes the
capability into the binary as a file capability (apps/netagent/Dockerfile), so
the process stays non-root with allowPrivilegeEscalation: false."""

# ── AdGuard Home ─────────────────────────────────────────────────────────────

[[exception]]
tool = "checkov"
rule = "CKV_K8S_25"
resources = ["StatefulSet/dns/adguard-home"]
until = 2027-05-15
reason = """Adds NET_BIND_SERVICE only. The upstream AdGuard Home binary
carries cap_net_bind_service as a file capability with the effective bit, and
such a binary cannot even be executed unless the capability is in the
container's bounding set (deploy/README.md, runtime rules). The pod is
non-root with every other capability dropped. The lite profile removes the
file capability instead (deploy/podman/adguard/Containerfile)."""

# ── Ports published on the node's LAN address, by a site ─────────────────────

[[exception]]
tool = "checkov"
rule = "CKV_K8S_26"
resources = ["StatefulSet/dns/adguard-home", "Deployment/netsoldier/web-ui"]
until = 2027-05-15
reason = """hostPort is how a site serves the household on a single-node
cluster with no load balancer: DNS (53/udp+tcp) and the web UI, the only two
things the LAN reaches. deploy/kustomize/components/site binds each to the
site's own LAN address (hostIP from site.env), never 0.0.0.0, and the
profiles themselves publish nothing; only sites render these ports."""

# ── Passive sensors of the proxmox-soc profile ───────────────────────────────

[[exception]]
tool = "checkov"
rule = "CKV_K8S_19"
resources = ["Deployment/netsoldier/ntopng", "Deployment/netsoldier/suricata", "Deployment/netsoldier/zeek"]
until = 2027-05-15
reason = """Passive sensors: they capture the mirrored LAN traffic on the
node's interface, which a pod network namespace does not see. They run with
read-only root filesystems and no Service; ntopng's Redis sidecar is bound to
127.0.0.1 for this reason. proxmox-soc is not exercised yet (its
kustomization); re-check when the profile is brought up."""

[[exception]]
tool = "checkov"
rule = "CKV_K8S_25"
resources = ["Deployment/netsoldier/ntopng", "Deployment/netsoldier/suricata", "Deployment/netsoldier/zeek"]
until = 2027-05-15
reason = """Capture capabilities only, every other one dropped: NET_RAW for the
packet socket and NET_ADMIN for promiscuous mode on the mirror interface
(plus SYS_NICE for Suricata's capture threads). Zeek's image bakes them into
the binary as file capabilities so it runs non-root. proxmox-soc is not
exercised yet; re-check the Suricata and ntopng grants when it is."""

[[exception]]
tool = "checkov"
rule = "CKV_K8S_23"
resources = ["Deployment/netsoldier/ntopng"]
until = 2027-05-15
reason = """ntopng starts as root to open its capture socket and drops to
`nobody` at once (-u=nobody); started non-root it cannot capture even with
file capabilities, because its own privilege handling resets the effective
set (comment in deploy/kustomize/base/ntopng/deployment.yaml). Kyverno's
require-non-root has a matching scoped exception; read-only root filesystem,
drop-all plus two capabilities, no privilege escalation and seccomp still
apply."""

[[exception]]
tool = "checkov"
rule = "CKV_K8S_8"
resources = ["Deployment/netsoldier/suricata", "Deployment/netsoldier/zeek"]
until = 2027-05-15
reason = """No liveness probe yet for the passive sensors: neither exposes a
health endpoint, and a probe that only checks the process exists adds nothing
to the kubelet restarting it when it exits. The useful probe is capture
progress (stats freshness), still to be designed; until then a sensor that
hangs while alive goes unnoticed. Revisit with the proxmox-soc bring-up."""

[[exception]]
tool = "checkov"
rule = "CKV_K8S_9"
resources = ["Deployment/netsoldier/suricata", "Deployment/netsoldier/zeek"]
until = 2027-05-15
reason = """Readiness gates traffic from a Service, and no Service selects the
sensors: they only capture and write logs that their Vector sidecars ship, so
readiness has nothing to decide."""

