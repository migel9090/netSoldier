apiVersion: batch/v1
kind: CronJob
metadata:
  name: clickhouse-cold-export
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: clickhouse
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            fsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: export
              image: clickhouse/clickhouse-client:24.3-alpine
              command: ["/bin/sh", "/scripts/export.sh"]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                limits:
                  cpu: 200m
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
              envFrom:
                - secretRef:
                    name: clickhouse-cold-export-s3
                    optional: true
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: clickhouse-cold-export
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
          restartPolicy: OnFailure
