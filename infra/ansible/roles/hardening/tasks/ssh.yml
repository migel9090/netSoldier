---
# A drop-in rather than edits to sshd_config: Debian reads sshd_config.d/
# first and the first value wins, so lines further down sshd_config (or in
# cloud-init's 50-cloud-init.conf) cannot override these.
- name: Harden sshd
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-netsoldier-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
