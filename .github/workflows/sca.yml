name: SCA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '40 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  osv-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        id: osv
        # Do not stop the job here: the SARIF upload below must still run so
        # findings reach code scanning. The explicit gate after it decides
        # whether the build fails.
        continue-on-error: true
        with:
          # --config is load-bearing: osv-scanner only auto-discovers an
          # osv-scanner.toml sitting next to each manifest it scans, so the
          # repo-root config holding the documented exceptions is silently
          # ignored unless it is named here.
          scan-args: |-
            --recursive
            --config
            osv-scanner.toml
            --format
            sarif
            --output
            osv.sarif
            ./

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4.36.1
        if: always()
        with:
          sarif_file: osv.sarif
          category: osv-scanner

      # Gate on the scan result. It previously ran with continue-on-error and
      # nothing else looked at the outcome, so a known-vulnerable dependency
      # could merge while the job showed green.
      - name: Fail on OSV findings
        if: steps.osv.outcome == 'failure'
        run: |
          echo "::error::OSV-Scanner reported vulnerable dependencies — see the code scanning results."
          exit 1

  grype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Grype scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: grype
        with:
          path: .
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4.36.1
        if: always()
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype
