# Example only — the real Secret is SOPS-encrypted and never committed in
# plaintext (same procedure as secret.example.yaml next to this file). It is
# not part of any kustomization: it belongs to the observability namespace,
# where the Vector aggregator and Grafana run as separate ArgoCD apps.
#
# Those two ClickHouse clients cannot read the clickhouse-credentials Secret
# in netsoldier, so their plaintext passwords live here. Each must match the
# *-password-sha256 value of the same account in the netsoldier Secret, which
# is what the server checks:
#
#   pw=$(openssl rand -hex 32)
#   echo -n "$pw" | sha256sum | cut -d' ' -f1   # -> netsoldier/clickhouse-credentials
#
#   vector-password   Vector aggregator sinks (deploy/observability/vector/values.yaml)
#   grafana-password  Grafana ClickHouse datasource
#                     (deploy/observability/kube-prometheus-stack/values.yaml)
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
  namespace: observability
type: Opaque
stringData:
  vector-password: "CHANGE-ME"
  grafana-password: "CHANGE-ME"
