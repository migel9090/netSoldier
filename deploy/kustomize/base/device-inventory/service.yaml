apiVersion: v1
kind: Service
metadata:
  name: device-inventory
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: device-inventory
---
# The address netagent posts frames to. It publishes the pod before it is
# ready: device-inventory's readiness IS the agent's heartbeat, so behind the
# readiness-gated Service above the first heartbeat could never arrive.
# The API consumers (web-ui, detection-engine) keep using the gated one.
apiVersion: v1
kind: Service
metadata:
  name: device-inventory-agent
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  ports:
    - port: 8081
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: device-inventory
