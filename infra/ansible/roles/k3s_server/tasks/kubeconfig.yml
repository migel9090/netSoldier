---
# Not part of the role's main tasks: run from kubeconfig.yml with
# k3s_kubeconfig_local_path set. The file holds cluster-admin credentials.
- name: Read the kubeconfig k3s wrote
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_raw
  no_log: true

- name: Create the local directory (owner only)
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig_local_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

# Point it at the node instead of 127.0.0.1 and rename "default" so it can
# sit next to other clusters in a merged kubeconfig.
- name: Write the kubeconfig (mode 0600)
  ansible.builtin.copy:
    content: >-
      {{ k3s_kubeconfig_raw.content | b64decode
         | replace('https://127.0.0.1:6443', k3s_api_endpoint)
         | regex_replace('(?m)^(\s*-?\s*(name|cluster|user|current-context): )default$', '\1' ~ k3s_kubeconfig_name) }}
    dest: "{{ k3s_kubeconfig_local_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
