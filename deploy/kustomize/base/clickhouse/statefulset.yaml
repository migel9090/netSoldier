# Sync order under ArgoCD: the server (wave -2) is up and Ready before the
# clickhouse-migrate Job (wave -1, migrate-job.yaml) builds the schema, and
# both complete before the services (default wave 0) are rolled out. The
# ServiceAccount, the ConfigMap and the Service carry the same wave because
# the pod and the Job cannot start without them.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: clickhouse
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Renders users-override.xml from the ConfigMap template plus the
        # SOPS-encrypted Secret, so no credential or hash is ever committed.
        # Substitution happens here rather than in the image so the
        # placeholders stay visible and reviewable in git.
        #
        # Fails closed: a missing or blank value, anything that is not a
        # SHA-256 hex digest, the digest of the empty password (the result
        # of `echo -n "" | sha256sum`, i.e. a blank password in disguise),
        # a CIDR that admits every address, or any placeholder left over
        # stops the pod before ClickHouse can start with it.
        - name: render-users
          image: busybox:1.37
          command:
            - sh
            - -ec
            - |
              empty_sha256=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
              cp /template/users-override.xml /rendered/users-override.xml.tmp
              for account in DEFAULT MIGRATE KILLSWITCH DETECTION INVENTORY \
                             ML_BEACON ML_FLOW ZEEK SURICATA VECTOR GRAFANA RITA; do
                var="${account}_PASSWORD_SHA256"
                eval "value=\${$var:-}"
                if [ -z "$value" ]; then
                  echo "FATAL: $var is empty — refusing to start ClickHouse with a" \
                       "blank credential. Populate the clickhouse-credentials Secret." >&2
                  exit 1
                fi
                # Lower-case only, as sha256sum prints it, so the
                # empty-password comparison below cannot be dodged by case.
                if ! echo "$value" | grep -Eqx '[0-9a-f]{64}'; then
                  echo "FATAL: $var is not a lower-case SHA-256 hex digest" \
                       "(echo -n \"\$password\" | sha256sum)." >&2
                  exit 1
                fi
                if [ "$value" = "$empty_sha256" ]; then
                  echo "FATAL: $var is the SHA-256 of an empty password." >&2
                  exit 1
                fi
                sed -i "s|__${var}__|${value}|g" /rendered/users-override.xml.tmp
              done
              case "${POD_CIDR:-}" in
                "" | 0.0.0.0/0 | ::/0)
                  echo "FATAL: POD_CIDR '${POD_CIDR:-}' is empty or admits every" \
                       "address; set it to the cluster's pod network." >&2
                  exit 1 ;;
              esac
              sed -i "s|__POD_CIDR__|${POD_CIDR}|g" /rendered/users-override.xml.tmp
              # Fail closed if any placeholder survived.
              if grep -q '__[A-Z_]*__' /rendered/users-override.xml.tmp; then
                echo "FATAL: unsubstituted placeholder in users-override.xml" >&2
                exit 1
              fi
              mv /rendered/users-override.xml.tmp /rendered/users-override.xml
          env:
            - name: DEFAULT_PASSWORD_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: default-password-sha256
            - name: MIGRATE_PASSWORD_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: migrate-password-sha256
            - name: KILLSWITCH_PASSWORD_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: killswitch-password-sha256
            - name: DETECTION_PASSWORD_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: detection-password-sha256
            - name: INVENTORY_PASSWORD_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: inventory-password-sha256
            - name: ML_BEACON_PASSWORD_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: ml-beacon-password-sha256
            - name: ML_FLOW_PASSWORD_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: ml-flow-password-sha256
            - name: ZEEK_PASSWORD_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: zeek-password-sha256
            - name: SURICATA_PASSWORD_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: suricata-password-sha256
            # The aggregator and Grafana live in the observability namespace
            # and read their plaintext passwords from a Secret there
            # (deploy/kustomize/base/clickhouse/observability-secret.example.yaml);
            # only the hashes are needed here.
            - name: VECTOR_PASSWORD_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: vector-password-sha256
            - name: GRAFANA_PASSWORD_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: grafana-password-sha256
            - name: RITA_PASSWORD_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: rita-password-sha256
            - name: POD_CIDR
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: pod-cidr
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: users-override
              mountPath: /template
            - name: users-rendered
              mountPath: /rendered
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.3-alpine
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
            - name: native
              containerPort: 9000
              protocol: TCP
          # Never set CLICKHOUSE_USER, CLICKHOUSE_PASSWORD or CLICKHOUSE_DB
          # here: the image entrypoint reacts to them by deleting `default`
          # and creating an account open to ::/0 (users.d/default-user.xml).
          # The schema is not created at startup either: the
          # /docker-entrypoint-initdb.d hook only ran on an empty data
          # directory, as the passwordless `default`, so it failed once
          # `default` had a password and silently skipped on every later
          # start. The clickhouse-migrate Job owns the schema now.
          env:
            # S3 credentials for the cold-tier disk (storage.xml sets
            # use_environment_credentials). Optional: without the secret
            # the cold volume is unreachable but the server still runs
            # hot-only (skip_access_check).
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: clickhouse-cold-export-s3
                  key: S3_ACCESS_KEY
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: clickhouse-cold-export-s3
                  key: S3_SECRET_KEY
                  optional: true
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config-override
              mountPath: /etc/clickhouse-server/config.d/memory-limits.xml
              subPath: memory-limits.xml
            - name: storage-config
              mountPath: /etc/clickhouse-server/config.d/storage.xml
              subPath: storage.xml
            - name: users-rendered
              mountPath: /etc/clickhouse-server/users.d/users-override.xml
              subPath: users-override.xml
            - name: tmp
              mountPath: /tmp
            - name: log
              mountPath: /var/log/clickhouse-server
      volumes:
        - name: config-override
          configMap:
            name: clickhouse-config
            items:
              - key: memory-limits.xml
                path: memory-limits.xml
        - name: storage-config
          configMap:
            name: clickhouse-config
            items:
              - key: storage.xml
                path: storage.xml
        - name: users-override
          configMap:
            name: clickhouse-config
            items:
              - key: users-override.xml
                path: users-override.xml
        # Holds the rendered users file. A ConfigMap mount is read-only, so
        # the placeholder substitution has to land somewhere writable.
        - name: users-rendered
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: log
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
