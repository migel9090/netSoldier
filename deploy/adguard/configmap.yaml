# AdGuard Home's initial configuration, as a template. The init container
# of the StatefulSet renders it on the first start, and on every start
# replaces the `users:` block with the account from the adguard-users Secret
# (generated at deploy time): this file carries no credential and no
# site address.
#
#   __UPSTREAM_DNS__  the site's resolvers (UPSTREAM_DNS in netsoldier-site),
#                     one list entry each; first start only
#   users             always rendered from the Secret
#
# After the first start AdGuard owns the file (the killswitch's block rules
# live in user_rules); a changed upstream needs the setting changed in
# AdGuard or the conf volume reset.
apiVersion: v1
kind: ConfigMap
metadata:
  name: adguard-config
  namespace: dns
data:
  AdGuardHome.yaml: |
    http:
      address: 0.0.0.0:3000
      session_ttl: 720h
    users: []
    dns:
      bind_hosts:
        - 0.0.0.0
      port: 53
      upstream_dns:
        - __UPSTREAM_DNS__
      # Used only to resolve DoH/DoT upstream host names.
      bootstrap_dns:
        - 1.1.1.1
        - 9.9.9.9
      all_servers: true
      fastest_addr: false
      cache_size: 4194304
      cache_ttl_min: 300
      cache_ttl_max: 86400
      cache_optimistic: true
      enable_dnssec: true
      anonymize_client_ip: false
      protection_enabled: true
      filtering_enabled: true
      blocking_mode: default
      blocked_response_ttl: 10
      edns_client_subnet:
        enabled: false
    querylog:
      enabled: true
      file_enabled: true
      interval: 168h
      size_memory: 5000
      anonymize_client_ip: false
    statistics:
      enabled: true
      interval: 168h
    filters:
      - enabled: true
        url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
        name: AdGuard DNS filter
        id: 1
      - enabled: true
        url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt
        name: AdAway Default Blocklist
        id: 2
    # The killswitch's DNS sinkhole adds and removes its rules here through
    # the API.
    user_rules: []
    clients:
      # In a pod the system resolver is the cluster's, which knows no LAN
      # names, so reverse lookups of clients would only time out.
      runtime_sources:
        whois: false
        arp: true
        rdns: false
        dhcp: true
        hosts: true
      # Per-device settings belong to the site; none are shipped.
      persistent: []
    schema_version: 29
