apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeek
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zeek
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zeek
    spec:
      serviceAccountName: zeek
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # seed /var/intel/intel.dat before zeek starts so the Intel
        # framework never sees a missing file; on failure fall back to
        # a header-only file (the sidecar retries every 15 min).
        - name: intel-init
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              curl -fsS --max-time 30 -o /var/intel/intel.dat \
                "http://threat-intel-sync.netsoldier.svc:8083/export/zeek/intel.dat" \
              || printf '#fields\tindicator\tindicator_type\tmeta.source\tmeta.desc\tmeta.url\n' \
                   > /var/intel/intel.dat
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: intel
              mountPath: /var/intel
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi
      containers:
        - name: zeek
          # The image bakes cap_net_raw,cap_net_admin into the zeek binary as
          # file capabilities (see the Dockerfile), so the pod captures fully
          # non-root with no privileged init container — the kernel grants the
          # caps on exec because they are file caps within the bounding set
          # (capabilities.add below).
          image: ghcr.io/migel9090/zeek:main
          command:
            - /usr/local/zeek/bin/zeek
            - "-i"
            - af_packet::eth1
            - /etc/zeek-site/netsoldier.zeek
          workingDir: /var/log/zeek
          env:
            # RITA log-spool retention (minutes); prune in archive-rotated.sh
            - name: ZEEK_SPOOL_RETENTION_MIN
              value: "360"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_RAW
                - NET_ADMIN
              drop:
                - ALL
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 384Mi
          volumeMounts:
            - name: site
              mountPath: /etc/zeek-site
              readOnly: true
            - name: intel
              mountPath: /var/intel
              readOnly: true
            - name: log
              mountPath: /var/log/zeek
            - name: spool
              mountPath: /var/spool/zeek
            - name: tmp
              mountPath: /tmp
        # refresh the Intel indicator file; atomic rename triggers the
        # input framework's re-read on the zeek side
        - name: intel-sync
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                sleep 900
                if curl -fsS --max-time 30 -o /var/intel/intel.dat.tmp \
                     "http://threat-intel-sync.netsoldier.svc:8083/export/zeek/intel.dat"; then
                  mv /var/intel/intel.dat.tmp /var/intel/intel.dat
                fi
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: intel
              mountPath: /var/intel
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
        - name: vector
          image: timberio/vector:0.43.1-distroless-libc
          args:
            - "--config-yaml"
            - /etc/vector/vector.yaml
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: vector-config
              mountPath: /etc/vector/vector.yaml
              subPath: vector.yaml
              readOnly: true
            - name: log
              mountPath: /var/log/zeek
              readOnly: true
            - name: vector-data
              mountPath: /var/lib/vector
      volumes:
        - name: site
          configMap:
            name: zeek-config
            defaultMode: 493
        - name: intel
          emptyDir:
            sizeLimit: 200Mi
        - name: spool
          persistentVolumeClaim:
            claimName: zeek-spool
        - name: vector-config
          configMap:
            name: zeek-vector-config
        - name: log
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir: {}
        - name: vector-data
          emptyDir:
            sizeLimit: 100Mi
