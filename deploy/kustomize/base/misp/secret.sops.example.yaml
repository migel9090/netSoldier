# MISP secrets — encrypt before committing:
#   sops --encrypt --in-place secret.sops.yaml
#
# The .sops.yaml at repo root configures the age recipient key.
# Copy this file to secret.sops.yaml, fill in real values, then encrypt.
apiVersion: v1
kind: Secret
metadata:
  name: misp-secrets
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "CHANGEME_mariadb_root"
  MYSQL_PASSWORD: "CHANGEME_misp_db_user"
  MISP_ADMIN_PASSPHRASE: "CHANGEME_misp_admin_password"
