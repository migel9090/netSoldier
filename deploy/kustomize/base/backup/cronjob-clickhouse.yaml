apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-clickhouse
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: clickhouse-backup
        spec:
          serviceAccountName: backup
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: clickhouse/clickhouse-client:24.3-alpine
              command: ["/bin/sh", "/scripts/backup-clickhouse.sh"]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              envFrom:
                - secretRef:
                    name: backup-s3
                    optional: true
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: backup-scripts
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
          restartPolicy: OnFailure
