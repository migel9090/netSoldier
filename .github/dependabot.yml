version: 2

updates:
  # ── Go modules ────────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /apps/detection-engine
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    labels:
      - dependencies
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /apps/device-inventory
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /apps/killswitch-controller
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /apps/threat-intel-sync
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    labels:
      - dependencies
    open-pull-requests-limit: 5

  # ── Python ────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /apps/ml-anomaly
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    labels:
      - dependencies
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"

  # ── Node.js ───────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/web-ui
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    labels:
      - dependencies
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns:
          - "*"

  # ── Docker base images ────────────────────────────────────────
  - package-ecosystem: docker
    directory: /apps/detection-engine
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(deps)"
    labels:
      - dependencies

  # ── GitHub Actions ────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
      - ci
    groups:
      actions-deps:
        patterns:
          - "*"
