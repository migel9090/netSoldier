apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  annotations:
    # The migrate Job (wave -1) reaches the server through this Service.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  type: ClusterIP
  ports:
    - port: 8123
      targetPort: http
      protocol: TCP
      name: http
    - port: 9000
      targetPort: native
      protocol: TCP
      name: native
  selector:
    app.kubernetes.io/component: server
