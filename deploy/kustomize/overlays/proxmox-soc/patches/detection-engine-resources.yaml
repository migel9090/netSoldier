# The SOC profile has an OpenTelemetry collector: naming its endpoint is what
# turns tracing on (without one, detection-engine exports nothing). The
# capture settings this patch used to carry (SPAN_INTERFACE,
# FLOW_IDLE_TIMEOUT, NET_RAW) are gone with the capture itself; flows come
# from Zeek.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection-engine
  namespace: netsoldier
spec:
  template:
    spec:
      containers:
        - name: detection-engine
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector.observability.svc:4317"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
