# The killswitch's edges. The agent poll (netagent, on the host network) is
# admitted by an ipBlock in components/site.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-killswitch-controller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: killswitch-controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # POST /evaluate (ingest token) and the operator API (web UI's proxy).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: detection-engine
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web-ui
      ports:
        - port: 8084
          protocol: TCP
  egress:
    # Audit forwarding.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
              app.kubernetes.io/component: server
      ports:
        - port: 8123
          protocol: TCP
    # The DNS sinkhole driver (AdGuard's API).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dns
          podSelector:
            matchLabels:
              app.kubernetes.io/name: adguard-home
      ports:
        - port: 3000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
