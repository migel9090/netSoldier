---
- name: Hash admin password with bcrypt
  ansible.builtin.set_fact:
    argocd_password_hash: "{{ argocd_admin_password | password_hash('bcrypt') }}"
  no_log: true

- name: Patch ArgoCD admin password
  ansible.builtin.command:
    cmd: >-
      kubectl patch secret argocd-secret
      -n {{ argocd_namespace }}
      --type merge
      -p '{"stringData":{"admin.password":"{{ argocd_password_hash }}","admin.passwordMtime":"{{ now(utc=true).isoformat() }}"}}'
  environment:
    KUBECONFIG: "{{ argocd_kubeconfig }}"
  no_log: true

- name: Remove initial admin password secret
  ansible.builtin.command:
    cmd: >-
      kubectl delete secret argocd-initial-admin-secret
      -n {{ argocd_namespace }}
      --ignore-not-found
  environment:
    KUBECONFIG: "{{ argocd_kubeconfig }}"
  changed_when: false
