apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: detection-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detection-engine
    spec:
      serviceAccountName: detection-engine
      securityContext:
        runAsNonRoot: true
      containers:
        - name: detection-engine
          image: ghcr.io/migel9090/detection-engine:main
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
