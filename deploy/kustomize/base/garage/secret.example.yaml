# Example only — NOT referenced by kustomization.yaml. Create the real
# secret via SOPS (see .sops.yaml) or manually:
#
#   kubectl -n storage create secret generic garage-secrets \
#     --from-literal=GARAGE_RPC_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=GARAGE_ADMIN_TOKEN="$(openssl rand -base64 32)" \
#     --from-literal=S3_ACCESS_KEY="GK$(openssl rand -hex 12)" \
#     --from-literal=S3_SECRET_KEY="$(openssl rand -hex 32)"
#
# GARAGE_RPC_SECRET must be exactly 32 bytes hex-encoded (64 characters);
# Garage refuses to start otherwise. S3_ACCESS_KEY must start with "GK"
# and be 26 characters, matching the ids Garage mints itself.
#
# The S3_ACCESS_KEY / S3_SECRET_KEY pair is what garage-bucket-init imports,
# so the same values belong in the clickhouse-cold-export-s3 and backup-s3
# secrets (S3_ACCESS_KEY / S3_SECRET_KEY) in the netsoldier namespace, and
# in the clickhouse-s3-credentials secret the server reads for the cold
# tier disk.
apiVersion: v1
kind: Secret
metadata:
  name: garage-secrets
  namespace: storage
type: Opaque
stringData:
  # 64 hex characters; `openssl rand -hex 32` produces one.
  GARAGE_RPC_SECRET: "changeme"
  GARAGE_ADMIN_TOKEN: "changeme"
  # "GK" followed by 24 hex characters.
  S3_ACCESS_KEY: "changeme"
  S3_SECRET_KEY: "changeme"
