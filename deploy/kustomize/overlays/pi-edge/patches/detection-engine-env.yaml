apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection-engine
spec:
  template:
    spec:
      containers:
        - name: detection-engine
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: ADGUARD_URL
              value: "http://adguard-web.dns.svc:3000"
            - name: ADGUARD_USER
              value: "admin"
            - name: ADGUARD_PASSWORD
              value: "changeme"
            - name: THREATLIST_PATH
              value: "/etc/detection-engine/domains.txt"
            - name: POLL_INTERVAL
              value: "30s"
