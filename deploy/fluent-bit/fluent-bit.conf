# Fluent Bit configuration for netSoldier Pi edge.
# Collects container logs (via journald) and Suricata EVE JSON,
# forwards everything to Vector on the server for enrichment
# and fan-out to ClickHouse + Loki.

[SERVICE]
    Flush             5
    Grace             10
    Log_Level         info
    Parsers_File      /fluent-bit/etc/parsers.conf
    HTTP_Server       On
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020
    storage.path      /fluent-bit/cache
    storage.sync      normal
    storage.checksum  off
    storage.max_chunks_up  64

# ── Inputs ──────────────────────────────────────────────────────

# Container logs from all netSoldier Podman Quadlets via journald.
# Each container's structured JSON is in the MESSAGE field.
[INPUT]
    Name              systemd
    Tag               journal.netsoldier
    Systemd_Filter    _SYSTEMD_UNIT=detection-engine.service
    Systemd_Filter    _SYSTEMD_UNIT=device-inventory.service
    Systemd_Filter    _SYSTEMD_UNIT=web-ui.service
    Systemd_Filter    _SYSTEMD_UNIT=adguard.service
    Read_From_Tail    On
    Strip_Underscores On
    storage.type      filesystem

# Suricata EVE JSON log (available after Suricata deployment).
# Each line is a self-contained JSON event.
[INPUT]
    Name              tail
    Tag               suricata.eve
    Path              /var/log/suricata/eve.json
    Parser            json
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Empty_Lines  On
    DB                /fluent-bit/cache/suricata-eve.db
    storage.type      filesystem

# ── Filters ─────────────────────────────────────────────────────

# Try to parse the journald MESSAGE field as JSON (container structured logs).
[FILTER]
    Name              parser
    Match             journal.*
    Key_Name          MESSAGE
    Parser            json
    Reserve_Data      On
    Preserve_Key      Off

# Tag every record with the edge hostname and profile.
[FILTER]
    Name              modify
    Match             *
    Add               _edge_host ${HOSTNAME}
    Add               _profile pi-edge

# Nest Suricata metadata under a common structure.
[FILTER]
    Name              modify
    Match             suricata.*
    Add               _source suricata

# Tag journal records with their service name.
[FILTER]
    Name              modify
    Match             journal.*
    Rename            SYSTEMD_UNIT _source

# ── Output ──────────────────────────────────────────────────────

# Forward all data to Vector on the server.
# Vector listens on the fluent source (Fluentd forward protocol).
[OUTPUT]
    Name              forward
    Match             *
    Host              ${VECTOR_HOST}
    Port              ${VECTOR_PORT}
    Retry_Limit       5
    storage.total_limit_size  50M
