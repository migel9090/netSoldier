apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "detection-engine.fullname" . }}
  labels:
    {{- include "detection-engine.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "detection-engine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "detection-engine.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "detection-engine.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: detection-engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
