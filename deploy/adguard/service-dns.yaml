apiVersion: v1
kind: Service
metadata:
  name: adguard-dns
  namespace: dns
  labels:
    app.kubernetes.io/name: adguard-home
    app.kubernetes.io/component: dns
spec:
  type: ClusterIP
  ports:
    - port: 53
      targetPort: dns-tcp
      protocol: TCP
      name: dns-tcp
    - port: 53
      targetPort: dns-udp
      protocol: UDP
      name: dns-udp
  selector:
    app.kubernetes.io/name: adguard-home
