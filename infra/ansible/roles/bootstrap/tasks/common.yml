---
- name: Check for cloud-init
  ansible.builtin.stat:
    path: /usr/bin/cloud-init
  register: bootstrap_cloud_init

# On a fresh cloud image cloud-init may still be upgrading packages; apt
# would fail on its lock.
- name: Wait for cloud-init to finish first boot
  ansible.builtin.command: cloud-init status --wait
  register: bootstrap_cloud_init_status
  changed_when: false
  # 0 = done, 2 = done with recoverable errors (still worth carrying on).
  failed_when: bootstrap_cloud_init_status.rc not in [0, 2]
  when: bootstrap_cloud_init.stat.exists

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ bootstrap_packages }}"
    state: present

- name: Find installed kernels
  ansible.builtin.find:
    paths: /boot
    patterns: "vmlinuz-*"
  register: bootstrap_kernels
  when: bootstrap_reboot_for_kernel

- name: Reboot into the newest kernel
  ansible.builtin.reboot:
    reboot_timeout: 600
    msg: "Rebooting into the newly installed kernel (Ansible bootstrap)"
  when:
    - bootstrap_reboot_for_kernel
    - bootstrap_kernels.files | length > 0
    - (bootstrap_kernels.files | map(attribute='path') | map('regex_replace', '^/boot/vmlinuz-', '')
       | community.general.version_sort | last) != ansible_facts.kernel

- name: Set timezone symlink
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ bootstrap_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Write timezone name
  ansible.builtin.copy:
    content: "{{ bootstrap_timezone }}\n"
    dest: /etc/timezone
    mode: "0644"

- name: Ensure locale is generated
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*{{ bootstrap_locale }}'
    line: "{{ bootstrap_locale }} UTF-8"
  notify: Regenerate locales

- name: Set default locale
  ansible.builtin.copy:
    content: "LANG={{ bootstrap_locale }}\n"
    dest: /etc/default/locale
    mode: "0644"

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
