apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: netsoldier-alerts
spec:
  groups:
    - name: netsoldier.rules
      rules:
        - alert: NetSoldierServiceDown
          expr: up{job=~"detection-engine|device-inventory"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} is down"
            description: >-
              {{ $labels.job }} in namespace {{ $labels.namespace }}
              has been unreachable for over 2 minutes.

        - alert: DetectionEnginePollErrors
          expr: rate(detection_engine_poll_errors_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Detection engine cannot poll AdGuard"
            description: >-
              detection-engine has sustained AdGuard querylog poll errors
              ({{ $value | printf "%.2f" }}/s over 5 m).

        - alert: WebhookDeliveryFailures
          expr: rate(detection_engine_webhook_deliveries_total{result="failure"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Webhook delivery failures"
            description: >-
              detection-engine webhook deliveries are failing
              ({{ $value | printf "%.2f" }}/s over 5 m).

        - alert: WebhookQueueDrops
          expr: rate(detection_engine_webhook_deliveries_total{result="dropped"}[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Webhook queue is dropping alerts"
            description: >-
              detection-engine webhook queue is full and dropping alerts
              ({{ $value | printf "%.2f" }}/s over 5 m). The downstream
              receiver may be unreachable or too slow.

        - alert: CriticalIoCDetected
          expr: increase(detection_engine_alerts_generated_total{severity=~"critical|high"}[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Critical/high-severity IoC detected"
            description: >-
              detection-engine matched {{ $value }} critical/high IoC(s)
              in the last 5 minutes. Investigate immediately.

        - alert: DeviceEventsStopped
          expr: time() - device_inventory_last_device_event_timestamp_seconds > 900
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "No device events for 15+ minutes"
            description: >-
              device-inventory has not received any device discovery
              events for over 15 minutes. Network devices may be
              offline or the discovery pipeline is broken.

        - alert: KillswitchPendingApprovals
          expr: killswitch_actions_pending > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Killswitch actions awaiting approval"
            description: >-
              {{ $value }} enforcement action(s) are pending operator
              approval for over 2 minutes. Review and approve/reject
              in the netSoldier UI.
