apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: device-inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: device-inventory
    spec:
      serviceAccountName: device-inventory
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: device-inventory
          image: ghcr.io/migel9090/device-inventory:main
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":8081"
            - name: DB_PATH
              value: "/data/devices.db"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
