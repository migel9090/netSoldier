# The web UI serves its counters on a listener of their own (Service port
# `metrics`, 9464); its UI port answers /metrics with 404.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: web-ui
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: web-ui
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
