---
# Earlier versions of this role wrote "<user> ALL=(ALL) NOPASSWD:ALL" for a
# named login. That made any process running as that user root without a
# password. The role no longer grants sudo; remove what it used to write.
- name: Remove the passwordless-sudo rule earlier versions of this role wrote
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ hardening_admin_user }}"
    state: absent

- name: Lock root password
  ansible.builtin.user:
    name: root
    password_lock: true
