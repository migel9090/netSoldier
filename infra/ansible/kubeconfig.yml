---
# Copy the lab cluster's admin kubeconfig to this machine, mode 0600.
#   task lab:kubeconfig   (writes ~/.config/netsoldier-lab/kubeconfig)
- name: Fetch the k3s kubeconfig
  hosts: proxmox_soc
  become: true
  gather_facts: false
  vars:
    k3s_kubeconfig_local_path: "{{ undef(hint='pass -e k3s_kubeconfig_local_path=<file>') }}"
  tasks:
    - name: Fetch the kubeconfig
      ansible.builtin.include_role:
        name: k3s_server
        tasks_from: kubeconfig.yml
