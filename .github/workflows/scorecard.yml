name: Scorecard

# OpenSSF Scorecard (Apache-2.0): supply-chain posture of the repository
# (branch protection, pinned dependencies, token permissions, ...) as code
# scanning results. It runs on a schedule and after each push to main, never
# on pull requests: its checks judge repository settings and history rather
# than a change, so it is deliberately not a required check. The `scorecard`
# required check that branch protection used to name had no workflow at all
# (audit CI-2). Results stay in this repository's code scanning;
# publish_results (the public Scorecard API and badge) is off, so the job
# needs no OIDC token.

on:
  schedule:
    - cron: '30 4 * * 1'
  push:
    branches: [main]

permissions: {}

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      # Audit: Scorecard queries several public APIs (GitHub, OSV, the
      # OpenSSF best-practices badge) whose set changes between releases.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
