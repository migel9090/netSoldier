apiVersion: v1
kind: ConfigMap
metadata:
  name: netsoldier-tls-anomalies
  labels:
    grafana_dashboard: "1"
data:
  netsoldier-tls-anomalies.json: |-
    {
      "uid": "netsoldier-tls-anomalies",
      "title": "netSoldier — TLS Fingerprint Anomalies",
      "description": "Anomaly hunting over TLS metadata: tls_client_fp is netSoldier's first-party JA4-format TLS client fingerprint (ADR-0003), plus JA3, certificates and Intel framework hits. Metadata-only — no decryption.",
      "tags": ["netsoldier", "tls", "anomalies"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "editable": true,
      "time": { "from": "now-24h", "to": "now" },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "clickhouse",
            "type": "datasource",
            "query": "grafana-clickhouse-datasource",
            "current": { "selected": true, "text": "ClickHouse", "value": "ClickHouse" }
          }
        ]
      },
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "TLS Overview",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false
        },
        {
          "id": 1,
          "type": "stat",
          "title": "TLS Sessions",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT count() AS sessions FROM netsoldier.zeek_ssl WHERE $__timeFilter(timestamp)",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Distinct Client Fingerprints",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT uniqExact(tls_client_fp) AS fingerprints FROM netsoldier.zeek_ssl WHERE $__timeFilter(timestamp) AND tls_client_fp != ''",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null } ] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Legacy TLS (≤ 1.1 / SSLv3)",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT count() AS legacy FROM netsoldier.zeek_ssl WHERE $__timeFilter(timestamp) AND version IN ('SSLv3', 'TLSv10', 'TLSv11')",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "SNI-less Sessions",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT count() AS sniless FROM netsoldier.zeek_ssl WHERE $__timeFilter(timestamp) AND server_name = ''",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 1 } ] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "TLS Versions Over Time",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 5 },
          "targets": [
            {
              "editorType": "sql",
              "format": 2,
              "queryType": "sql",
              "rawSql": "SELECT $__timeInterval(timestamp) AS time, if(version = '', 'unknown', version) AS tls_version, count() AS sessions FROM netsoldier.zeek_ssl WHERE $__timeFilter(timestamp) GROUP BY time, tls_version ORDER BY time",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 15, "showPoints": "never", "stacking": { "mode": "normal" } }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "id": 200,
          "type": "row",
          "title": "Fingerprint Anomalies",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 13 },
          "collapsed": false
        },
        {
          "id": 6,
          "type": "table",
          "title": "New Client Fingerprints",
          "description": "tls_client_fp values first seen in the selected window (absent in the preceding 7 days). A new fingerprint means new client software on the network.",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 14 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT tls_client_fp, min(timestamp) AS first_seen, uniqExact(src_ip) AS clients, count() AS sessions, anyLast(server_name) AS example_sni FROM netsoldier.zeek_ssl WHERE $__timeFilter(timestamp) AND tls_client_fp != '' AND tls_client_fp NOT IN (SELECT DISTINCT tls_client_fp FROM netsoldier.zeek_ssl WHERE timestamp < $__fromTime AND timestamp >= $__fromTime - INTERVAL 7 DAY AND tls_client_fp != '') GROUP BY tls_client_fp ORDER BY first_seen DESC LIMIT 15",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              { "matcher": { "id": "byName", "options": "tls_client_fp" }, "properties": [ { "id": "displayName", "value": "Client Fingerprint" } ] },
              { "matcher": { "id": "byName", "options": "first_seen" }, "properties": [ { "id": "displayName", "value": "First Seen" }, { "id": "unit", "value": "dateTimeAsLocal" } ] },
              { "matcher": { "id": "byName", "options": "clients" }, "properties": [ { "id": "displayName", "value": "Clients" } ] },
              { "matcher": { "id": "byName", "options": "sessions" }, "properties": [ { "id": "displayName", "value": "Sessions" } ] },
              { "matcher": { "id": "byName", "options": "example_sni" }, "properties": [ { "id": "displayName", "value": "Example SNI" } ] }
            ]
          },
          "options": { "showHeader": true, "footer": { "show": false } }
        },
        {
          "id": 7,
          "type": "table",
          "title": "Rare Client Fingerprints",
          "description": "Fingerprints with ≤3 sessions in the window — unusual or one-off TLS client stacks.",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 14 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT tls_client_fp, count() AS sessions, uniqExact(src_ip) AS clients, anyLast(src_ip) AS example_src, anyLast(server_name) AS example_sni FROM netsoldier.zeek_ssl WHERE $__timeFilter(timestamp) AND tls_client_fp != '' GROUP BY tls_client_fp HAVING sessions <= 3 ORDER BY sessions ASC, tls_client_fp ASC LIMIT 15",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              { "matcher": { "id": "byName", "options": "tls_client_fp" }, "properties": [ { "id": "displayName", "value": "Client Fingerprint" } ] },
              { "matcher": { "id": "byName", "options": "sessions" }, "properties": [ { "id": "displayName", "value": "Sessions" } ] },
              { "matcher": { "id": "byName", "options": "clients" }, "properties": [ { "id": "displayName", "value": "Clients" } ] },
              { "matcher": { "id": "byName", "options": "example_src" }, "properties": [ { "id": "displayName", "value": "Example Source" } ] },
              { "matcher": { "id": "byName", "options": "example_sni" }, "properties": [ { "id": "displayName", "value": "Example SNI" } ] }
            ]
          },
          "options": { "showHeader": true, "footer": { "show": false } }
        },
        {
          "id": 8,
          "type": "table",
          "title": "SNI-less TLS Sessions",
          "description": "TLS without SNI is common for C2 frameworks and raw-IP connections. Correlated detection (dns-less TLS) runs in detection-engine; this is the hunting view.",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 23 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT timestamp, src_ip, dst_ip, dst_port, version, cipher, tls_client_fp FROM netsoldier.zeek_ssl WHERE $__timeFilter(timestamp) AND server_name = '' ORDER BY timestamp DESC LIMIT 20",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              { "matcher": { "id": "byName", "options": "timestamp" }, "properties": [ { "id": "displayName", "value": "Time" }, { "id": "unit", "value": "dateTimeAsLocal" } ] },
              { "matcher": { "id": "byName", "options": "tls_client_fp" }, "properties": [ { "id": "displayName", "value": "Client Fingerprint" } ] }
            ]
          },
          "options": { "showHeader": true, "sortBy": [{ "displayName": "Time", "desc": true }], "footer": { "show": false } }
        },
        {
          "id": 300,
          "type": "row",
          "title": "Certificates & Intel",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 31 },
          "collapsed": false
        },
        {
          "id": 9,
          "type": "table",
          "title": "Certificate Issuers",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 9, "w": 8, "x": 0, "y": 32 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT if(issuer = '', '(empty)', issuer) AS issuer, uniqExact(fingerprint) AS certs, count() AS seen FROM netsoldier.zeek_x509 WHERE $__timeFilter(timestamp) GROUP BY issuer ORDER BY seen DESC LIMIT 15",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              { "matcher": { "id": "byName", "options": "issuer" }, "properties": [ { "id": "displayName", "value": "Issuer" } ] },
              { "matcher": { "id": "byName", "options": "certs" }, "properties": [ { "id": "displayName", "value": "Certs" } ] },
              { "matcher": { "id": "byName", "options": "seen" }, "properties": [ { "id": "displayName", "value": "Seen" } ] }
            ]
          },
          "options": { "showHeader": true, "footer": { "show": false } }
        },
        {
          "id": 10,
          "type": "table",
          "title": "Short-Lived Certificates (≤ 30 days)",
          "description": "Very short validity is normal for ACME issuers but also typical of malware C2 infrastructure — review unknown issuers.",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 9, "w": 8, "x": 8, "y": 32 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT timestamp, subject, issuer, dateDiff('day', not_valid_before, not_valid_after) AS validity_days FROM netsoldier.zeek_x509 WHERE $__timeFilter(timestamp) AND dateDiff('day', not_valid_before, not_valid_after) <= 30 ORDER BY timestamp DESC LIMIT 15",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              { "matcher": { "id": "byName", "options": "timestamp" }, "properties": [ { "id": "displayName", "value": "Time" }, { "id": "unit", "value": "dateTimeAsLocal" } ] },
              { "matcher": { "id": "byName", "options": "validity_days" }, "properties": [ { "id": "displayName", "value": "Validity (days)" } ] }
            ]
          },
          "options": { "showHeader": true, "footer": { "show": false } }
        },
        {
          "id": 11,
          "type": "table",
          "title": "TLS / JA3 / Certificate Intel Hits",
          "description": "Zeek Intel framework matches on TLS client fingerprints (Intel::TLSFP), JA3 and certificate hashes, fed by threat-intel-sync.",
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "${clickhouse}" },
          "gridPos": { "h": 9, "w": 8, "x": 16, "y": 32 },
          "targets": [
            {
              "editorType": "sql",
              "format": 1,
              "queryType": "sql",
              "rawSql": "SELECT timestamp, indicator, indicator_type, src_ip, dst_ip, arrayStringConcat(sources, ', ') AS intel_sources FROM netsoldier.zeek_intel WHERE $__timeFilter(timestamp) AND indicator_type IN ('Intel::TLSFP', 'Intel::JA3', 'Intel::CERT_HASH') ORDER BY timestamp DESC LIMIT 20",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              { "matcher": { "id": "byName", "options": "timestamp" }, "properties": [ { "id": "displayName", "value": "Time" }, { "id": "unit", "value": "dateTimeAsLocal" } ] },
              { "matcher": { "id": "byName", "options": "indicator_type" }, "properties": [ { "id": "displayName", "value": "Type" } ] },
              { "matcher": { "id": "byName", "options": "intel_sources" }, "properties": [ { "id": "displayName", "value": "Sources" } ] }
            ]
          },
          "options": { "showHeader": true, "sortBy": [{ "displayName": "Time", "desc": true }], "footer": { "show": false } }
        }
      ]
    }
