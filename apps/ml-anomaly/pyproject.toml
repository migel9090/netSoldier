[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-anomaly"
version = "0.2.0"
description = "Behavioral anomaly detection for netSoldier — RITA beaconing glue + Isolation Forest"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
# The image installs the pinned, hashed requirements.txt generated from this
# list (see the header of that file); keep the two in step.
dependencies = [
    "httpx>=0.27",
    "joblib>=1.3",
    "prometheus-client>=0.21",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_anomaly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real ClickHouse; run tests/integration/run.sh",
]
