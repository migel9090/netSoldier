]
until = 2027-05-15
reason = """These carry first-party images (ghcr.io/migel9090/*), and the
committed :main is a placeholder that the deploy replaces: the lab renders
each build's unique tag (infra/lab/deploy.sh) and imports it straight into
containerd, so there is no registry digest to write down, and the GitOps path
has Kyverno's verifyImages pin every first-party reference to its signed
digest at admission (mutateDigest, verifyDigest, required). Third-party
images, including the zeek pod's sidecars, are pinned by digest in the
manifests."""

[[exception]]
tool = "checkov"
rule = "CKV_K8S_15"
resources = [
  "DaemonSet/netsoldier/netagent",
  "Deployment/netsoldier/detection-engine",
  "Deployment/netsoldier/device-inventory",
  "Deployment/netsoldier/killswitch-controller",
  "Deployment/netsoldier/threat-intel-sync",
  "Deployment/netsoldier/web-ui",
  "Deployment/netsoldier/ml-anomaly",
  "Deployment/netsoldier/zeek",
]
until = 2027-05-15
reason = """imagePullPolicy: Always would break the lab, whose images are
imported into containerd with no registry to pull from, and would make every
restart of a home appliance depend on the registry being reachable. The rule
protects private images cached on nodes shared between tenants; this is a
single-tenant cluster with public or locally built images, and the first-party
references are pinned per build (see the CKV_K8S_43 entry). Digest-pinned
third-party images already pass this check."""

# ── Secrets as environment variables ─────────────────────────────────────────

[[exception]]
tool = "checkov"
rule = "CKV_K8S_35"
resources = [
  "DaemonSet/netsoldier/netagent",
  "Deployment/netsoldier/detection-engine",
  "Deployment/netsoldier/device-inventory",
  "Deployment/netsoldier/killswitch-controller",
  "Deployment/netsoldier/threat-intel-sync",
  "Deployment/netsoldier/web-ui",
  "Deployment/netsoldier/ml-anomaly",
  "Deployment/netsoldier/suricata",
  "Deployment/netsoldier/zeek",
  "StatefulSet/dns/adguard-home",
  "StatefulSet/netsoldier/clickhouse",
  "Job/netsoldier/clickhouse-migrate",
  "CronJob/netsoldier/backup-clickhouse",
  "CronJob/netsoldier/backup-state",
  "CronJob/netsoldier/clickhouse-cold-export",
  "CronJob/netsoldier/rita-import",
  "StatefulSet/netsoldier/misp",
  "StatefulSet/netsoldier/misp-mariadb",
  "StatefulSet/storage/garage",
  "Job/storage/garage-bucket-init",
]
until = 2027-05-15
reason = """Credentials reach these containers as environment variables via
secretKeyRef, never as literals in a manifest: the first-party services read
their tokens from the environment (the same contract as the lite profile's
Podman secrets, type=env), and the third-party images (ClickHouse, MariaDB,
MISP, Garage, Vector, AdGuard's config renderer) take them that way. Files
would need *_FILE support in every service, which is application work. The
exposure that remains is /proc/<pid>/environ to the same UID inside a pod that
runs non-root with a read-only root filesystem. Review when the services
learn to read secrets from files."""

# ── Service-account token and API access: the state backup ───────────────────

[[exception]]
tool = "checkov"
rule = "CKV_K8S_38"
resources = ["CronJob/netsoldier/backup-state"]
until = 2027-05-15
reason = """The one pod that calls the Kubernetes API: the state backup reads
the namespace's Secrets and ConfigMaps (deploy/kustomize/base/backup/
configmap.yaml, kube_get) and age-encrypts them before they leave the pod, so
it mounts its token on purpose. Every other pod disables the token."""

[[exception]]
tool = "checkov"
rule = "CKV2_K8S_5"
resources = ["RoleBinding/netsoldier/backup-reader"]
until = 2027-05-15
reason = """Reading every Secret in the namespace is what the state backup is
for: a disaster-recovery copy of the namespace's credentials, encrypted to an
age recipient inside the pod. The Role is namespaced (netsoldier only, get and
list, no write) and bound to the backup ServiceAccount alone, which only the
backup-state CronJob mounts."""

# ── UIDs fixed by third-party images ─────────────────────────────────────────

[[exception]]
tool = "checkov"
rule = "CKV_K8S_40"
resources = [
  "StatefulSet/netsoldier/clickhouse",
  "Job/netsoldier/clickhouse-migrate",
  "CronJob/netsoldier/clickhouse-cold-export",
  "DaemonSet/netsoldier/fluent-bit",
  "Deployment/netsoldier/misp-redis",
  "Deployment/netsoldier/ntopng",
  "StatefulSet/netsoldier/misp",
  "StatefulSet/netsoldier/misp-mariadb",
  "StatefulSet/storage/garage",
]
until = 2027-05-15
reason = """Third-party images run as the unprivileged user each is built for
(ClickHouse 101, MariaDB and Redis 999, MISP's www-data 33, Garage and Fluent
Bit 1000; ntopng's own UID is covered by CKV_K8S_23): the paths they write are
owned by that UID, and ClickHouse refuses to start when its data directory's
owner differs from its effective UID. All are non-root with every capability
dropped. The rule's concern, a UID that matches a host account after an
escape, is addressed for every image at once by user namespaces
(hostUsers: false), to be evaluated on the lab's k3s before this date."""

