name: SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '25 3 * * 1'

permissions:
  contents: read

# Egress: every job runs harden-runner in block mode with the endpoints it
# was seen to need (step 125.3, from the runs' own harden-runner logs). The
# GitHub Actions service endpoints (results, caches, codeload) are allowed
# by harden-runner itself.

jobs:
  # The gate fails on every finding that scan-exceptions.toml does not cover
  # with a reason and a review date (Semgrep's --error, with reviewed
  # exceptions). Semgrep and its rules are pinned (scripts/ci/tools.sh,
  # requirements-semgrep.txt, semgrep-rules.txt) and run offline; Kubernetes
  # objects are judged as rendered. Same command locally: task scan:sast.
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/gate-setup

      - name: Semgrep
        run: task scan:sast -- --sarif semgrep.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # CodeQL blocks through code scanning: the "CodeQL" check that GitHub runs
  # on each pull request fails when the change brings new alerts at or above
  # the repository's threshold, and dismissed alerts stay dismissed. That
  # check is a required status check (.github/branch-protection.json).
  # `actions` analyses the workflows themselves (untrusted input in run:,
  # unsafe checkouts, excessive permissions).
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # CodeQL's autobuild walks every module in the workspace and runs
          # with GOTOOLCHAIN=local, so it cannot fetch a newer toolchain the
          # way a normal build would: the installed Go must satisfy every
          # module. go.work is the single source of truth for the version and
          # every go.mod carries the same release, so taking it from there
          # keeps extraction working on all modules.
          go-version-file: go.work
          cache-dependency-path: |
            apps/*/go.sum
            tests/e2e/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: codeql-${{ matrix.language }}
