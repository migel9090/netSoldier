# One-shot cluster bootstrap. The script it runs lives in bootstrap.py and
# is loaded into the garage-bootstrap ConfigMap by configMapGenerator in
# kustomization.yaml, so the Python stays a real file rather than a YAML
# string: lintable, and not read as infrastructure code by the IaC scanner
# (KICS took `KEY_SECRET = os.environ[...]` in the embedded copy for a
# hardcoded credential and failed the build on it).
#
# ArgoCD replaces the immutable Job on spec change.
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-bucket-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bucket-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: python:3.13-alpine3.22
          command: ["python3", "/opt/bootstrap/bootstrap.py"]
          env:
            - name: GARAGE_ADMIN_URL
              value: http://garage-admin.storage.svc:3903
            - name: S3_BUCKETS
              value: "netsoldier-cold netsoldier-backup"
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: GARAGE_ADMIN_TOKEN
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: S3_SECRET_KEY
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 32Mi
          volumeMounts:
            - name: bootstrap
              mountPath: /opt/bootstrap
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: garage-bootstrap
