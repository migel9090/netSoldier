# Example only — the real Secret is SOPS-encrypted and never committed in
# plaintext.
#
# api-key authenticates POST /feedback. That endpoint installs false-positive
# suppressions, and Suppressed() is checked BEFORE the killswitch webhook, so
# an unauthenticated caller could permanently stop any indicator from ever
# reaching enforcement — a quieter and more durable way to disable the
# killswitch than attacking the killswitch itself.
apiVersion: v1
kind: Secret
metadata:
  name: detection-engine-credentials
type: Opaque
stringData:
  api-key: "CHANGE-ME-generate-with-openssl-rand-base64-32"
