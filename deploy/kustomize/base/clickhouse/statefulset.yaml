apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: clickhouse
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.3-alpine
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
            - name: native
              containerPort: 9000
              protocol: TCP
          env:
            # S3 credentials for the cold-tier disk (storage.xml sets
            # use_environment_credentials). Optional: without the secret
            # the cold volume is unreachable but the server still runs
            # hot-only (skip_access_check).
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: clickhouse-cold-export-s3
                  key: S3_ACCESS_KEY
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: clickhouse-cold-export-s3
                  key: S3_SECRET_KEY
                  optional: true
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config-override
              mountPath: /etc/clickhouse-server/config.d/memory-limits.xml
              subPath: memory-limits.xml
            - name: storage-config
              mountPath: /etc/clickhouse-server/config.d/storage.xml
              subPath: storage.xml
            - name: users-override
              mountPath: /etc/clickhouse-server/users.d/users-override.xml
              subPath: users-override.xml
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
            - name: tmp
              mountPath: /tmp
            - name: log
              mountPath: /var/log/clickhouse-server
      volumes:
        - name: config-override
          configMap:
            name: clickhouse-config
            items:
              - key: memory-limits.xml
                path: memory-limits.xml
        - name: storage-config
          configMap:
            name: clickhouse-config
            items:
              - key: storage.xml
                path: storage.xml
        - name: users-override
          configMap:
            name: clickhouse-config
            items:
              - key: users-override.xml
                path: users-override.xml
        - name: init-sql
          configMap:
            name: clickhouse-init
        - name: tmp
          emptyDir: {}
        - name: log
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
