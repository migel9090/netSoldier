# netsoldier.conf for the lab host: the simulated LAN of host/lan.sh.
# Same format and keys as deploy/podman/netsoldier.conf.example; only what
# differs from the defaults is set.
LAN_INTERFACE=nslab0
HOST_IP=192.168.77.2
GATEWAY_IP=192.168.77.1
GATEWAY_MAC=02:00:5e:77:00:01
LAN_NETWORKS=192.168.77.0/24

# No protected devices beyond the host and the router (which the installer
# always protects), and automatic blocking off, as shipped. The scenario's
# auto-block phase re-installs with AUTO_BLOCK=on (and the thresholds
# lowered to the local list's 80/high), then restores this file.
PROTECTED_MACS=
PROTECTED_IPS=
AUTO_BLOCK=off

# Short enough to watch a block expire during the scenario.
BLOCK_TTL=240

# Images built on the host by host/build-images.sh.
IMAGE_PREFIX=localhost/netsoldier
IMAGE_TAG=lab
