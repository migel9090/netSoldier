apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: misp
spec:
  serviceName: misp
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        app.kubernetes.io/component: core
    spec:
      serviceAccountName: misp
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        fsGroup: 33
      containers:
        - name: misp
          image: ghcr.io/misp/misp-docker/misp-core:v2.4.190
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: misp-config
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: misp-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: misp-secrets
                  key: MYSQL_PASSWORD
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: misp-secrets
                  key: MISP_ADMIN_PASSPHRASE
          livenessProbe:
            httpGet:
              path: /users/login
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /users/login
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/www/MISP/app/files
            - name: gnupg
              mountPath: /var/www/MISP/.gnupg
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
            - name: logs
              mountPath: /var/www/MISP/app/tmp/logs
      volumes:
        - name: gnupg
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: misp
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: core
