apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-intel-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: threat-intel-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: threat-intel-sync
    spec:
      serviceAccountName: threat-intel-sync
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: threat-intel-sync
          image: ghcr.io/migel9090/threat-intel-sync:main
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":8083"
            - name: SYNC_INTERVAL
              value: "6h"
            - name: MISP_URL
              value: "http://misp.netsoldier.svc"
            - name: THREATFOX_DAYS
              value: "7"
            - name: URLHAUS_LIMIT
              value: "1000"
          envFrom:
            - secretRef:
                name: threat-intel-sync-secrets
                optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
