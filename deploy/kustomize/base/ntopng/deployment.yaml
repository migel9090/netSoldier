apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntopng
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ntopng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntopng
    spec:
      serviceAccountName: ntopng
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # ntopng starts as root to open the capture socket and immediately drops
      # to `nobody` (-u=nobody in the config) for the rest of its lifetime.
      # It cannot capture when started non-root even with file capabilities
      # (its internal libcap privilege management resets the effective set),
      # unlike the zeek sensor which runs fully non-root. The root start is
      # covered by a scoped require-non-root Kyverno exception; every other
      # hardening control (read-only rootfs, drop-all+add-two caps, no
      # privilege escalation, seccomp) still applies.
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ntopng
          image: ntop/ntopng@sha256:c029d8351490ffdfb51904e4cb06de89b3b992966ee31879bff87dfab7e9baf4
          command:
            - ntopng
            - /etc/ntopng/ntopng.conf
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_RAW
                - NET_ADMIN
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: 3001
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            periodSeconds: 15
          resources:
            limits:
              cpu: "1"
              memory: 768Mi
            requests:
              cpu: 250m
              memory: 384Mi
          volumeMounts:
            - name: config
              mountPath: /etc/ntopng
              readOnly: true
            - name: data
              mountPath: /var/lib/ntopng
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
        # hostNetwork pod: redis must stay loopback-only
        - name: redis
          image: redis:7-alpine
          args:
            - "--bind"
            - "127.0.0.1"
            - "--port"
            - "6379"
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            - "--maxmemory"
            - "128mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command: ["redis-cli", "-h", "127.0.0.1", "ping"]
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            exec:
              command: ["redis-cli", "-h", "127.0.0.1", "ping"]
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 160Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: redis-tmp
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: ntopng-config
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: redis-tmp
          emptyDir:
            sizeLimit: 64Mi
