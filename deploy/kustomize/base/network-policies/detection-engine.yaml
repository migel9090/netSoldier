apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-detection-engine
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: detection-engine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # /alerts and /feedback through the web UI's proxy.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web-ui
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # AdGuard's query log (the API, never DNS).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dns
          podSelector:
            matchLabels:
              app.kubernetes.io/name: adguard-home
      ports:
        - port: 3000
          protocol: TCP
    # Sensor and ML ingest, feedback persistence.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
              app.kubernetes.io/component: server
      ports:
        - port: 8123
          protocol: TCP
    # Client IP -> MAC and name for every detection.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: device-inventory
      ports:
        - port: 8081
          protocol: TCP
    # IoC sync (/export/json).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: threat-intel-sync
      ports:
        - port: 8083
          protocol: TCP
    # Enforcement webhook -> killswitch POST /evaluate. Without this half
    # the killswitch's ingress rule alone admits nothing.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: killswitch-controller
      ports:
        - port: 8084
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
