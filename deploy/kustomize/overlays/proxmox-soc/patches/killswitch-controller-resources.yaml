apiVersion: apps/v1
kind: Deployment
metadata:
  name: killswitch-controller
  namespace: netsoldier
spec:
  template:
    spec:
      containers:
        - name: killswitch-controller
          # Step 117: a composite needs >= 2 corroborating signal classes for
          # auto-block. A single known-bad feed match still auto-blocks;
          # lone heuristics go to human approval.
          env:
            - name: POLICY_AUTO_MIN_SIGNALS
              value: "2"
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
