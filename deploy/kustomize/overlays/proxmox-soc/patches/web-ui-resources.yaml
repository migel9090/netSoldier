apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
spec:
  template:
    spec:
      containers:
        - name: web-ui
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
