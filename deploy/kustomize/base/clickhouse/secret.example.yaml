# Documentation of the keys only — never applied. The lab deployment
# (infra/lab/deploy.sh) generates every password at deploy time and applies
# the Secret directly; nothing usable is ever committed.
#
# ClickHouse holds the DNS query log, the flow records and the enforcement
# audit log — the whole evidentiary record of the monitor. Every client has
# its own account with only the grants its code needs (see the comments on
# each account in configmap.yaml, users-override.xml). The account names are
# fixed there and set as plain values in each client's manifest; only the
# passwords live here.
#
# Generate each password and its hash together:
#
#   pw=$(openssl rand -hex 32)
#   echo "password: $pw"
#   echo -n "$pw" | sha256sum | cut -d' ' -f1   # the *-password-sha256 value
#
# Use hex: the Vector sidecars substitute the password into their config
# text, where quotes, backslashes or `$` would break it.
#
# The server's init container renders the *-password-sha256 values into
# users-override.xml and refuses to start ClickHouse if any is missing, is
# not a SHA-256 hex digest, or is the digest of an empty password. The
# plaintext *-password values are what the clients authenticate with.
#
# vector-password-sha256 and grafana-password-sha256 are needed here for
# the server; the matching plaintext passwords go into the Secret in the
# observability namespace (observability-secret.example.yaml next to this
# file).
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
type: Opaque
stringData:
  # Local-only break-glass administrator (kubectl exec ... clickhouse-client).
  default-password: "CHANGE-ME"
  default-password-sha256: "CHANGE-ME-sha256-of-the-above"

  # clickhouse-migrate Job: the only account that can change the schema.
  migrate-password: "CHANGE-ME"
  migrate-password-sha256: "CHANGE-ME-sha256-of-the-above"

  # killswitch-controller: INSERT into audit_log only.
  killswitch-password: "CHANGE-ME"
  killswitch-password-sha256: "CHANGE-ME-sha256-of-the-above"

  # detection-engine.
  detection-password: "CHANGE-ME"
  detection-password-sha256: "CHANGE-ME-sha256-of-the-above"

  # device-inventory.
  inventory-password: "CHANGE-ME"
  inventory-password-sha256: "CHANGE-ME-sha256-of-the-above"

  # ml-anomaly beacon-sync (reads RITA's output, writes ml_beacons).
  ml-beacon-password: "CHANGE-ME"
  ml-beacon-password-sha256: "CHANGE-ME-sha256-of-the-above"

  # ml-anomaly flow-anomaly (reads connections, writes ml_anomalies).
  ml-flow-password: "CHANGE-ME"
  ml-flow-password-sha256: "CHANGE-ME-sha256-of-the-above"

  # Vector sidecars of the Zeek and Suricata pods.
  zeek-password: "CHANGE-ME"
  zeek-password-sha256: "CHANGE-ME-sha256-of-the-above"
  suricata-password: "CHANGE-ME"
  suricata-password-sha256: "CHANGE-ME-sha256-of-the-above"

  # Vector aggregator and Grafana (observability namespace): hashes only.
  vector-password-sha256: "CHANGE-ME-sha256-of-the-vector-password"
  grafana-password-sha256: "CHANGE-ME-sha256-of-the-grafana-password"

  # RITA importer: owns its own databases only.
  rita-password: "CHANGE-ME"
  rita-password-sha256: "CHANGE-ME-sha256-of-the-above"

  # The pod network allowed to authenticate is a site value now (POD_CIDR in
  # the netsoldier-site ConfigMap); 0.0.0.0/0 and ::/0 are refused.
