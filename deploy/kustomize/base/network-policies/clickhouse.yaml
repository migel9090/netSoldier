apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-clickhouse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: killswitch-controller
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: detection-engine
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: device-inventory
      ports:
        - port: 8123
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: suricata
      ports:
        - port: 8123
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zeek
      ports:
        - port: 8123
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
              app.kubernetes.io/component: cold-export
      ports:
        - port: 8123
          protocol: TCP
        - port: 9000
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backup
              app.kubernetes.io/component: clickhouse-backup
      ports:
        - port: 9000
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rita
      ports:
        - port: 9000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 8123
          protocol: TCP
        - port: 9000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
