apiVersion: apps/v1
kind: Deployment
metadata:
  name: killswitch-controller
spec:
  template:
    spec:
      containers:
        - name: killswitch-controller
          # Step 117: require >=2 corroborating signal classes for auto-block.
          # A single known-bad IoC feed match (no composite metadata) still
          # auto-blocks instantly; lone heuristics (beacon/volumetric/TLS)
          # go to human approval unless a composite corroborates them.
          env:
            - name: POLICY_AUTO_MIN_SIGNALS
              value: "2"
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
