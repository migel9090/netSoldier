---
# k3s lab node (the Proxmox VM). Per-host values (address, user, allowed
# sources) come from the inventory Terraform generates.

# Pods reach the API server and the kubelet (metrics-server) through the
# node address, so the pod network is a source too. Nothing else on the LAN
# may reach 6443 or 10250.
hardening_ufw_rules:
  - { port: "22", proto: tcp, from: "{{ hardening_ssh_allowed_cidrs }}", comment: "SSH (admins)" }
  - { port: "6443", proto: tcp, from: "{{ k3s_api_allowed_cidrs }}", comment: "k3s API (admins)" }
  - { port: "6443", proto: tcp, from: ["{{ k3s_cluster_cidr }}"], comment: "k3s API (pods)" }
  - { port: "10250", proto: tcp, from: ["{{ k3s_cluster_cidr }}"], comment: "kubelet (pods)" }

# Same default as roles/k3s_server; needed here because the hardening role
# (which runs first) builds its firewall rules from it.
k3s_cluster_cidr: 10.42.0.0/16
