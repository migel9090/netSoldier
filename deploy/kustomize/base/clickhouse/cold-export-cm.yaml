apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-cold-export
data:
  export.sh: |
    #!/bin/sh
    set -eu

    : "${CH_HOST:=clickhouse.netsoldier.svc}"
    : "${CH_PORT:=8123}"
    : "${CH_DATABASE:=netsoldier}"

    if [ -z "${S3_ENDPOINT:-}" ] || [ -z "${S3_BUCKET:-}" ]; then
      echo "S3_ENDPOINT or S3_BUCKET not set — skipping cold export"
      exit 0
    fi

    : "${S3_ACCESS_KEY:=}"
    : "${S3_SECRET_KEY:=}"

    YESTERDAY=$(date -d yesterday +%Y-%m-%d)
    YEAR=$(date -d yesterday +%Y)
    MONTH=$(date -d yesterday +%m)
    DAY=$(date -d yesterday +%d)

    # All time-series tables (hot tier is 30-90d per table TTL; cold tier
    # keeps Parquet in object storage indefinitely). Includes the Phase-2
    # analytics tables (step 119): Suricata/Zeek sensors, RITA beacons,
    # Isolation-Forest anomalies, Zeek Intel hits, alerts and FP feedback.
    TABLES="network_flows dns_queries connections device_events alerts suricata_alerts suricata_dns suricata_tls zeek_conn zeek_dns zeek_ssl zeek_x509 zeek_http zeek_intel ml_beacons ml_anomalies detection_feedback"

    for TABLE in $TABLES; do
      DEST="${S3_ENDPOINT}/${S3_BUCKET}/cold/${TABLE}/year=${YEAR}/month=${MONTH}/day=${DAY}/${TABLE}.parquet"
      echo "Exporting ${CH_DATABASE}.${TABLE} for ${YESTERDAY} → ${DEST}"

      QUERY="INSERT INTO FUNCTION s3('${DEST}', '${S3_ACCESS_KEY}', '${S3_SECRET_KEY}', 'Parquet') SELECT * FROM ${CH_DATABASE}.${TABLE} WHERE toDate(timestamp) = '${YESTERDAY}'"

      clickhouse-client \
        --host "${CH_HOST}" \
        --port 9000 \
        --query "${QUERY}" \
        && echo "  OK: ${TABLE}" \
        || echo "  WARN: ${TABLE} export failed (may be empty)"
    done

    echo "Cold export complete for ${YESTERDAY}"
