apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-device-inventory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: device-inventory
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web-ui
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: detection-engine
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backup
      ports:
        - port: 8081
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 8081
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
              app.kubernetes.io/component: server
      ports:
        - port: 8123
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
