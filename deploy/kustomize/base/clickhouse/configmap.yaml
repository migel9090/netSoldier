apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  annotations:
    # Same wave as the StatefulSet that mounts it (see statefulset.yaml).
    argocd.argoproj.io/sync-wave: "-2"
data:
  # No background_pool_size here. It was set to 4, and 24.3 exits at
  # startup with code 36: the merge-tree default
  # number_of_free_entries_in_pool_to_execute_mutation (20) must not exceed
  # background_pool_size x background_merges_mutations_concurrency_ratio
  # (4 x 2 = 8). Shrinking the pool would mean lowering the merge-tree
  # thresholds as well and starving mutations (TTL moves, the ALTERs in the
  # migrations) on a box that is mostly idle, so the server keeps its
  # default pool.
  memory-limits.xml: |
    <clickhouse>
        <max_server_memory_usage_ratio>0.5</max_server_memory_usage_ratio>
        <background_schedule_pool_size>2</background_schedule_pool_size>
        <mark_cache_size>536870912</mark_cache_size>
    </clickhouse>
  storage.xml: |
    <clickhouse>
        <storage_configuration>
            <disks>
                <!-- Cold tier on in-cluster Garage (step 119). Credentials
                     come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env
                     vars (clickhouse-cold-export-s3 secret, optional).
                     skip_access_check lets the server boot when Garage is
                     down or the secret is absent: inserts always land on
                     the hot volume first, only background TTL moves fail
                     (and retry) until the cold disk is reachable. -->
                <s3_cold>
                    <type>s3</type>
                    <endpoint>http://garage.storage.svc:3900/netsoldier-cold/native/</endpoint>
                    <use_environment_credentials>true</use_environment_credentials>
                    <skip_access_check>true</skip_access_check>
                    <metadata_path>/var/lib/clickhouse/disks/s3_cold/</metadata_path>
                </s3_cold>
            </disks>
            <policies>
                <!-- The hot volume keeps the name `default` so tables
                     created under the implicit default policy can be
                     switched with ALTER ... MODIFY SETTING storage_policy
                     (the new policy must contain the old volumes/disks). -->
                <tiered>
                    <volumes>
                        <default>
                            <disk>default</disk>
                        </default>
                        <cold>
                            <disk>s3_cold</disk>
                            <!-- Never write parts straight to S3 on insert,
                                 even when their move-TTL is already expired
                                 (e.g. backfilled data): an unreachable Garage
                                 must not block ingest. Background moves pick
                                 the parts up later. -->
                            <perform_ttl_move_on_insert>false</perform_ttl_move_on_insert>
                        </cold>
                    </volumes>
                </tiered>
            </policies>
        </storage_configuration>
    </clickhouse>
  # One account per client, each holding exactly the grants its code uses
  # (the Go clients under apps/*/internal, the ml-anomaly Python, the Vector
  # sinks, the Grafana dashboards, RITA). Two rules hold throughout:
  #   - only `migrate` can change the netsoldier schema; every other
  #     account is table-scoped INSERT and/or SELECT, so a compromised
  #     service or sensor pod cannot drop, truncate or ALTER ... DELETE the
  #     audit trail, and cannot read tables it has no use for;
  #   - RITA reads and writes only its own databases, and only ml_beacon
  #     reads RITA's output.
  # A new client, or a new table for an existing one, gets its grant here in
  # the same change.
  users-override.xml: |
    <clickhouse>
        <profiles>
            <default>
                <max_memory_usage>1073741824</max_memory_usage>
                <max_execution_time>60</max_execution_time>
            </default>
            <!-- The migration runner copies whole tables when a key or a
                 column type changes (020, 021, 023). On the Pi profile's
                 µSD card that can take far longer than the 60 s every other
                 account gets; the Job's activeDeadlineSeconds bounds it
                 instead. -->
            <migrate>
                <profile>default</profile>
                <max_execution_time>0</max_execution_time>
            </migrate>
            <!-- RITA v5 emits SQL that the new ClickHouse analyzer rejects
                 (ARRAY JOIN aliases not in GROUP BY); scope the legacy
                 analyzer to RITA only so netSoldier's own queries keep the
                 default. RITA imports are long-running batch scans. -->
            <rita>
                <allow_experimental_analyzer>0</allow_experimental_analyzer>
                <max_execution_time>1800</max_execution_time>
            </rita>
        </profiles>
        <users>
            <!-- Accounts are defined here with placeholders and their real
                 password hashes are substituted from the SOPS-encrypted
                 clickhouse-credentials Secret by the init container (see
                 statefulset.yaml), which refuses to start the server if any
                 of them is missing, malformed or the hash of an empty
                 password. Nothing in this repo carries a usable credential. -->

            <!-- default: the local break-glass administrator for `kubectl
                 exec ... clickhouse-client`. No service uses it.
                 The stock users.xml gives it an empty <password> and
                 ::/0, and both have to be removed explicitly: a
                 password_sha256_hex next to the stock <password> is a
                 startup error ("More than one field of 'password',
                 'password_sha256_hex' ..."), and a plain <networks> block
                 is merged into the stock one instead of replacing it. -->
            <default>
                <password remove="1"/>
                <password_sha256_hex>__DEFAULT_PASSWORD_SHA256__</password_sha256_hex>
                <networks replace="replace">
                    <ip>127.0.0.1</ip>
                    <ip>::1</ip>
                </networks>
                <profile>default</profile>
            </default>

            <!-- migrate: the clickhouse-migrate Job (deploy/clickhouse/
                 migrate.sh). The only account that can change the schema,
                 and only inside netsoldier: no DROP DATABASE, no access
                 management, nothing on RITA's databases. It also owns the
                 runner's bookkeeping table, netsoldier.schema_migrations.
                 Views since 028 (network_flows over zeek_conn). A migration
                 that needs more (dictionaries) extends this grant in the
                 same change. -->
            <migrate>
                <password_sha256_hex>__MIGRATE_PASSWORD_SHA256__</password_sha256_hex>
                <profile>migrate</profile>
                <networks><ip>__POD_CIDR__</ip></networks>
                <grants>
                    <query>GRANT CREATE DATABASE, CREATE TABLE, CREATE VIEW, DROP TABLE, DROP VIEW, ALTER TABLE, SELECT, INSERT ON netsoldier.*</query>
                </grants>
            </migrate>

            <!-- killswitch: killswitch-controller's audit writer
                 (internal/actions/audit.go). Append-only: it can add audit
                 records and cannot read, rewrite or delete any. -->
            <killswitch>
                <password_sha256_hex>__KILLSWITCH_PASSWORD_SHA256__</password_sha256_hex>
                <profile>default</profile>
                <networks><ip>__POD_CIDR__</ip></networks>
                <grants>
                    <query>GRANT INSERT ON netsoldier.audit_log</query>
                </grants>
            </killswitch>

            <!-- detection: detection-engine. Tails the sensor and ML tables
                 (internal/ingest), persists and reloads analyst feedback
                 (internal/feedback), and copies its alert history and the
                 AdGuard query log it reads (internal/chexport). The local
                 store stays the record of alerts and the delivery outbox;
                 nothing here is read back. INSERT on alerts and dns_queries
                 only: it cannot read the household's DNS history. -->
            <detection>
                <password_sha256_hex>__DETECTION_PASSWORD_SHA256__</password_sha256_hex>
                <profile>default</profile>
                <networks><ip>__POD_CIDR__</ip></networks>
                <grants>
                    <query>GRANT SELECT ON netsoldier.suricata_alerts</query>
                    <query>GRANT SELECT ON netsoldier.zeek_intel</query>
                    <query>GRANT SELECT ON netsoldier.zeek_ssl</query>
                    <query>GRANT SELECT ON netsoldier.ml_beacons</query>
                    <query>GRANT SELECT ON netsoldier.ml_anomalies</query>
                    <query>GRANT SELECT, INSERT ON netsoldier.detection_feedback</query>
                    <query>GRANT INSERT ON netsoldier.alerts</query>
                    <query>GRANT INSERT ON netsoldier.dns_queries</query>
                </grants>
            </detection>

            <!-- inventory: device-inventory. Writes sightings and the device
                 snapshot (cmd/device-inventory pipeline) and reads per-device
                 history for the detail and topology APIs (internal/api). Its
                 start-up check looks both written tables up in system.tables,
                 which only lists tables the account holds a grant on.
                 network_flows is a view over zeek_conn that runs with the
                 reader's privileges, hence zeek_conn; the connection history
                 names each destination from zeek_ssl and zeek_http. -->
            <inventory>
                <password_sha256_hex>__INVENTORY_PASSWORD_SHA256__</password_sha256_hex>
                <profile>default</profile>
                <networks><ip>__POD_CIDR__</ip></networks>
                <grants>
                    <query>GRANT INSERT ON netsoldier.device_events</query>
                    <query>GRANT INSERT ON netsoldier.devices</query>
                    <query>GRANT SELECT ON netsoldier.network_flows</query>
                    <query>GRANT SELECT ON netsoldier.zeek_conn</query>
                    <query>GRANT SELECT ON netsoldier.zeek_ssl</query>
                    <query>GRANT SELECT ON netsoldier.zeek_http</query>
                    <query>GRANT SELECT ON netsoldier.dns_queries</query>
                    <query>GRANT SELECT ON netsoldier.alerts</query>
                </grants>
            </inventory>

            <!-- ml_beacon: ml-anomaly's beacon-sync container
                 (ml_anomaly.sync). The one account that crosses pipelines:
                 it reads RITA's threat_mixtape and writes ml_beacons. No
                 account used to hold both, so every beacon sync was
                 refused. -->
            <ml_beacon>
                <password_sha256_hex>__ML_BEACON_PASSWORD_SHA256__</password_sha256_hex>
                <profile>default</profile>
                <networks><ip>__POD_CIDR__</ip></networks>
                <grants>
                    <query>GRANT SELECT ON netsoldier_rita.threat_mixtape</query>
                    <query>GRANT SELECT, INSERT ON netsoldier.ml_beacons</query>
                </grants>
            </ml_beacon>

            <!-- ml_flow: ml-anomaly's flow-anomaly container
                 (ml_anomaly.flowsync, and ml_anomaly.train which it calls).
                 Nothing on RITA's databases. -->
            <ml_flow>
                <password_sha256_hex>__ML_FLOW_PASSWORD_SHA256__</password_sha256_hex>
                <profile>default</profile>
                <networks><ip>__POD_CIDR__</ip></networks>
                <grants>
                    <query>GRANT SELECT ON netsoldier.zeek_conn</query>
                    <query>GRANT SELECT, INSERT ON netsoldier.ml_anomalies</query>
                </grants>
            </ml_flow>

            <!-- zeek / suricata: the Vector sidecars next to each sensor.
                 Separate accounts because each sensor parses hostile
                 traffic: a compromised Zeek pod must not be able to forge
                 the Suricata alerts detection-engine acts on, or the
                 reverse. INSERT only. -->
            <zeek>
                <password_sha256_hex>__ZEEK_PASSWORD_SHA256__</password_sha256_hex>
                <profile>default</profile>
                <networks><ip>__POD_CIDR__</ip></networks>
                <grants>
                    <query>GRANT INSERT ON netsoldier.zeek_conn</query>
                    <query>GRANT INSERT ON netsoldier.zeek_dns</query>
                    <query>GRANT INSERT ON netsoldier.zeek_ssl</query>
                    <query>GRANT INSERT ON netsoldier.zeek_x509</query>
                    <query>GRANT INSERT ON netsoldier.zeek_http</query>
                    <query>GRANT INSERT ON netsoldier.zeek_intel</query>
                </grants>
            </zeek>
            <suricata>
                <password_sha256_hex>__SURICATA_PASSWORD_SHA256__</password_sha256_hex>
                <profile>default</profile>
                <networks><ip>__POD_CIDR__</ip></networks>
                <grants>
                    <query>GRANT INSERT ON netsoldier.suricata_alerts</query>
                    <query>GRANT INSERT ON netsoldier.suricata_dns</query>
                    <query>GRANT INSERT ON netsoldier.suricata_tls</query>
                </grants>
            </suricata>

            <!-- vector: the Vector aggregator (deploy/observability/vector,
                 observability namespace). It has nothing to write since
                 step 125.10: network_flows is a view over zeek_conn, events
                 is gone, and alerts and dns_queries are detection-engine's.
                 The account stays until the aggregator's ClickHouse sinks
                 are removed, with an explicitly empty grant list: a user
                 defined here WITHOUT a <grants> element gets every
                 privilege. -->
            <vector>
                <password_sha256_hex>__VECTOR_PASSWORD_SHA256__</password_sha256_hex>
                <profile>default</profile>
                <networks><ip>__POD_CIDR__</ip></networks>
                <grants/>
            </vector>

            <!-- grafana: the Grafana ClickHouse datasource
                 (observability namespace). The dashboards span nearly every
                 netsoldier table, so this grant is database-wide, but it is
                 read-only and does not reach RITA's databases. -->
            <grafana>
                <password_sha256_hex>__GRAFANA_PASSWORD_SHA256__</password_sha256_hex>
                <profile>default</profile>
                <networks><ip>__POD_CIDR__</ip></networks>
                <grants>
                    <query>GRANT SELECT ON netsoldier.*</query>
                </grants>
            </grafana>

            <!-- rita: the RITA importer manages its own schema (it creates,
                 alters and truncates tables and materialized views on every
                 import), so it keeps DDL, but only inside its own two
                 databases: no access_management, no
                 named_collection_control (which exposed the Garage S3
                 credentials), nothing on netsoldier.*. ALL on a database
                 includes CREATE DATABASE for that name, so the former
                 CREATE DATABASE ON *.* is gone too. -->
            <rita>
                <password_sha256_hex>__RITA_PASSWORD_SHA256__</password_sha256_hex>
                <profile>rita</profile>
                <networks><ip>__POD_CIDR__</ip></networks>
                <grants>
                    <query>GRANT ALL ON netsoldier_rita.*</query>
                    <query>GRANT ALL ON metadatabase.*</query>
                </grants>
            </rita>
        </users>
    </clickhouse>
