# Single-node MinIO backing the ClickHouse cold tier (step 119) and the
# backup CronJob. S3 API only: the embedded browser is disabled, no console.
# Root credentials come from the `minio-root` secret (see
# secret.example.yaml; real values are provided via SOPS, never committed).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z
          args: ["server", "/data", "--address", ":9000"]
          env:
            - name: MINIO_BROWSER
              value: "off"
            - name: MINIO_UPDATE
              value: "off"
            # MinIO looks for TLS certs under $HOME/.minio; point it at a
            # writable emptyDir to keep the root filesystem read-only.
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: minio-root
          ports:
            - name: s3
              containerPort: 9000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
