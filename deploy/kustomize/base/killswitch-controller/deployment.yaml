apiVersion: apps/v1
kind: Deployment
metadata:
  name: killswitch-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: killswitch-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: killswitch-controller
    spec:
      serviceAccountName: killswitch-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: killswitch-controller
          image: ghcr.io/migel9090/killswitch-controller:main
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":8084"
            - name: CLICKHOUSE_URL
              value: "http://clickhouse.netsoldier.svc:8123"
            - name: CLICKHOUSE_DATABASE
              value: "netsoldier"
            # The audit log is the accountability record for every
            # enforcement decision; the account writing it is authenticated
            # and holds INSERT on audit_log only.
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: writer-username
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: writer-password
            # Authenticates every mutating endpoint. Without it the
            # controller serves approve/revert to anything that can reach it.
            - name: KILLSWITCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: killswitch-credentials
                  key: api-key
            # Verifies the HMAC on inbound detection events so a tampered
            # payload cannot raise confidence or re-target an action.
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: killswitch-credentials
                  key: webhook-secret
            # Devices that must never be enforced against. While empty the
            # controller disables auto-block and queues everything for a
            # human — see allowlist-configmap.yaml.
            - name: ALLOWLIST_MACS
              valueFrom:
                configMapKeyRef:
                  name: killswitch-allowlist
                  key: ALLOWLIST_MACS
            - name: ALLOWLIST_IPS
              valueFrom:
                configMapKeyRef:
                  name: killswitch-allowlist
                  key: ALLOWLIST_IPS
            - name: ADGUARD_URL
              value: "http://adguard-web.dns.svc:3000"
            - name: ADGUARD_USER
              valueFrom:
                secretKeyRef:
                  name: adguard-credentials
                  key: username
            - name: ADGUARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adguard-credentials
                  key: password
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
