name: SCA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '40 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  osv-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        id: osv
        # Do not stop the job here: the SARIF upload below must still run so
        # findings reach code scanning. The explicit gate after it decides
        # whether the build fails.
        continue-on-error: true
        with:
          # --config is load-bearing: osv-scanner only auto-discovers an
          # osv-scanner.toml sitting next to each manifest it scans, so the
          # repo-root config holding the documented exceptions is silently
          # ignored unless it is named here.
          scan-args: |-
            --recursive
            --config
            osv-scanner.toml
            --format
            sarif
            --output
            osv.sarif
            ./

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: osv.sarif
          category: osv-scanner

      # Gate on the scan result. It previously ran with continue-on-error and
      # nothing else looked at the outcome, so a known-vulnerable dependency
      # could merge while the job showed green.
      - name: Fail on OSV findings
        if: steps.osv.outcome == 'failure'
        run: |
          echo "::error::OSV-Scanner reported vulnerable dependencies — see the code scanning results."
          exit 1

  grype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Grype scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        with:
          path: .
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype
