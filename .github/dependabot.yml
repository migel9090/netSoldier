version: 2

# Every manifest in the repository is covered. Auto-merge is deliberately
# off: every update goes through review and the CI gates like any other PR.
#
# No `labels:` keys on purpose. Custom labels that do not exist in the
# repository make Dependabot post an error on every PR; without the key it
# applies its default `dependencies` + ecosystem labels and creates them if
# they are missing.

updates:
  # ── Go modules ────────────────────────────────────────────────
  # One grouped PR across all modules so the go.work workspace stays
  # consistent. Dependabot does not touch the `go` directive, go.work or
  # go.work.sum: after merging, run `go work sync` if the workspace drifted.
  - package-ecosystem: gomod
    directories:
      - /apps/detection-engine
      - /apps/device-inventory
      - /apps/killswitch-controller
      - /apps/threat-intel-sync
      - /libs/events
      - /tests/e2e
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns:
          - "*"

  # ── Python ────────────────────────────────────────────────────
  # scripts/ci: the hash-pinned tools of the CI gates (requirements.txt).
  - package-ecosystem: pip
    directories:
      - /apps/ml-anomaly
      - /scripts/ci
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"

  # ── Node.js ───────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/web-ui
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns:
          - "*"

  # ── Docker base images ────────────────────────────────────────
  # The golang: tag is one of the places that carry the single project Go
  # version (go.work is the source of truth; every go.mod matches). A PR
  # bumping it must also bump `go` in go.work and every go.mod. Base images
  # are pinned by digest (tag@sha256); Dependabot moves both. A node:22
  # bump must also move node-version in the web-ui job of ci.yml.
  - package-ecosystem: docker
    directories:
      - /apps/detection-engine
      - /apps/device-inventory
      - /apps/killswitch-controller
      - /apps/threat-intel-sync
      - /apps/ml-anomaly
      - /apps/web-ui
      - /deploy/docker/zeek
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 5
    groups:
      go-base-image:
        patterns:
          - "golang"

  # ── Terraform providers ───────────────────────────────────────
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 5

  # ── GitHub Actions ────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-deps:
        patterns:
          - "*"
