reason = """.sops.yaml names ${NETSOLDIER_AGE_RECIPIENT}, which SOPS does not
expand, so nothing can be encrypted on a fresh clone (audit CI-8). Choosing
the project's real age recipient, whose private key the owners hold, is
roadmap step 125.7 (GitOps secrets). Waived only until then; the plaintext and
deploys-example checks are not waived."""

# ════════════════════════════════════════════════════════════════════════════
# validate (scripts/validate-configs.py): home-network values outside sites/
# ════════════════════════════════════════════════════════════════════════════
#
# Roadmap 125.12: the owner's LAN prefix and capture interface (the pattern
# HOME_NETWORK in validate-configs.py) may appear only in a site
# (deploy/kustomize/sites/), an example file, tests and the dated audit
# records. These files carried them when the check was added; each entry
# names where the value goes instead, and the check warns when a file is
# clean so its entry can be removed.

[[exception]]
tool = "validate"
rule = "home-network"
files = [
  "deploy/kustomize/base/ntopng/configmap.yaml",
  "deploy/kustomize/base/suricata/configmap.yaml",
  "deploy/kustomize/base/zeek/deployment.yaml",
]
until = 2026-12-31
reason = """The capture interface name is hard-coded in the proxmox-soc sensor
bases. It is the site's SPAN interface and moves into sites/<name> with the
other network-dependent values (roadmap 125.12)."""

[[exception]]
tool = "validate"
rule = "home-network"
files = [
  "deploy/helm/netsoldier/values-pi-edge.yaml",
  "deploy/helm/netsoldier/values-proxmox-soc.yaml",
]
until = 2026-12-31
reason = """The vestigial Helm chart that no target renders, which decision D2
removes (roadmap 125.12); its profile values carry a Vector host address and
a SPAN interface from one household."""

[[exception]]
tool = "validate"
rule = "home-network"
files = [
  "infra/README.md",
  "infra/lab/proxmox-token.sh",
  "infra/terraform/outputs.tf",
  "infra/terraform/variables.tf",
]
until = 2026-12-31
reason = """Lab tooling defaults from the owner's network (the Proxmox
endpoint, the lab VM address, gateway and DNS). They move to untracked lab
configuration ($LAB_CONFIG/lab.env, an extra *.auto.tfvars) with terraform
plan showing no change for the existing VM (lab follow-up of step 125.6)."""

[[exception]]
tool = "validate"
rule = "home-network"
files = [
  "apps/killswitch-controller/internal/policy/allowlist.go",
  "apps/ml-anomaly/src/ml_anomaly/beacon.py",
  "apps/web-ui/src/lib/server/config.ts",
  "docs/user-guide.md",
]
until = 2026-12-31
reason = """Illustrations, not configuration: code comments, the web UI's
"ORIGIN is not set" message and an ALLOWLIST_IPS example in the user guide
use addresses from the owner's LAN prefix. They should use the documentation
range 192.0.2.0/24 or point at the site configuration (backend and docs
owners)."""
