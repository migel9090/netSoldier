# Resources and placement only: device-inventory holds no capability on any
# profile (ADR-0004); netagent captures.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-inventory
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: device-inventory
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
