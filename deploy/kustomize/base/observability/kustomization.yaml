# Dashboards, alert rules and the ServiceMonitors of the core services. They
# need the Prometheus Operator's CRDs, so only profiles with the
# observability stack include this (overlays/proxmox-soc).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - grafana-dashboard-cm.yaml
  - grafana-dns-threat-intel-cm.yaml
  - grafana-killswitch-audit-cm.yaml
  - grafana-network-overview-cm.yaml
  - grafana-dpi-protocols-cm.yaml
  - grafana-tls-anomalies-cm.yaml
  - grafana-beaconing-anomalies-cm.yaml
  - prometheus-rules.yaml
  - servicemonitor-detection-engine.yaml
  - servicemonitor-device-inventory.yaml
  - servicemonitor-killswitch-controller.yaml
  - servicemonitor-threat-intel-sync.yaml
  - servicemonitor-web-ui.yaml
