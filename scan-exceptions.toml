resources = [
  "Pod/netsoldier-smoke/kernel-gvisor",
  "Pod/netsoldier-smoke/kernel-runc",
  "Pod/netsoldier-smoke/healthz-client",
]
until = 2027-05-15
reason = """Same run-to-completion test pods: no Service selects them and they
exit within seconds, so readiness has nothing to gate."""

[[exception]]
tool = "checkov"
rule = "CKV_K8S_43"
resources = ["Pod/netsoldier-smoke/detection-engine"]
until = 2027-05-15
reason = """The smoke test checks that the image published now runs under
